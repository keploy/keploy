# docker-compose.yml — end-to-end reproduction of the CA-bundle-merge fix.
#
# Two services share a volume at /shared:
#
#   1. `ca-writer`: runs the Go harness that exercises setupSharedVolume in a
#      debian slim container with ca-certificates installed, writing
#      /shared/ca.crt (system bundle + keploy MITM CA merged) and
#      /shared/keploy-ca.crt (keploy MITM CA only).
#
#   2. `tls-probe`: reuses the same image (which has curl + ca-certificates)
#      and stays alive long enough for run.sh to exec curl probes against
#      https://sts.us-east-1.amazonaws.com/ — once with the merged bundle
#      (must succeed) and once with keploy-only (must fail with curl exit
#      60).
#
# The test does NOT depend on the Keploy agent or on the admission webhook —
# it exercises the exact function-under-change (setupSharedVolume) in the
# exact distro footprint that the webhook injects env vars into (a
# container with a system trust store and REQUESTS_CA_BUNDLE overriding it).

services:
  ca-writer:
    build:
      # Build context is repo root so the harness can import the tls package.
      context: ../../../
      dockerfile: tests/e2e/ca-bundle-merge/Dockerfile.setup
      args:
        # Docker Hub's official images (see Dockerfile.setup for why not ECR
        # Public); run.sh pulls them first, with a retry, and exports these.
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:trixie-slim}
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-writer
    environment:
      - EXPORT_PATH=/shared
    volumes:
      - ca-shared:/shared
    restart: "no"

  tls-probe:
    # Reuses the writer image (curl + ca-certificates + debian slim). Keeps
    # the probe's distro matched to the writer's so the OS bundle parity is
    # exactly what a real customer with a shared-EmptyDir would see.
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-probe
    depends_on:
      ca-writer:
        condition: service_completed_successfully
      ca-writer-nobundle:
        condition: service_completed_successfully
      ca-writer-certdir:
        condition: service_completed_successfully
      ca-writer-certfile:
        condition: service_completed_successfully
      corp-server:
        condition: service_started
    entrypoint: [""]
    command: ["sleep", "600"]
    volumes:
      - ca-shared:/shared:ro
      - ca-nobundle:/shared-nobundle:ro
      - ca-certdir:/shared-certdir:ro
      - ca-certfile:/shared-certfile:ro

  # --- Trust-store sources other than the image's CA bundle -----------------
  #
  # corp-pki writes a private "corporate" PKI (a CA, and a leaf it signed for
  # corp-server) to the corp volume; corp-server serves HTTPS with that leaf.
  # The three writers below build the merged bundle the way an agent would:
  #
  #   ca-writer-nobundle  /etc/ssl/certs is an empty volume (the k8s sidecar's
  #                       shape; an image that ships no CA bundle): the merged
  #                       bundle must still hold public roots — keploy's
  #                       built-in Mozilla list — and the writer must log
  #                       nothing at WARN or above.
  #   ca-writer-certdir   the same, plus SSL_CERT_DIR naming the corporate CA's
  #                       directory: public roots AND the corporate CA.
  #   ca-writer-certfile  the image's CA bundle, with SSL_CERT_FILE naming the
  #                       corporate CA: the operator's bundle is honoured.
  corp-pki:
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-corp-pki
    command: ["gen-corp", "/corp"]
    volumes:
      - corp:/corp
    restart: "no"

  corp-server:
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-corp-server
    command: ["serve-corp", "/corp"]
    depends_on:
      corp-pki:
        condition: service_completed_successfully
    volumes:
      - corp:/corp:ro

  ca-writer-nobundle:
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-writer-nobundle
    environment:
      - EXPORT_PATH=/shared-nobundle
    tmpfs:
      - /etc/ssl/certs
    volumes:
      - ca-nobundle:/shared-nobundle
    restart: "no"

  ca-writer-certdir:
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-writer-certdir
    depends_on:
      corp-pki:
        condition: service_completed_successfully
    environment:
      - EXPORT_PATH=/shared-certdir
      - SSL_CERT_DIR=/corp/ca
    tmpfs:
      - /etc/ssl/certs
    volumes:
      - corp:/corp:ro
      - ca-certdir:/shared-certdir
    restart: "no"

  ca-writer-certfile:
    image: kpl-ca-merge:local
    container_name: kpl-ca-merge-writer-certfile
    depends_on:
      corp-pki:
        condition: service_completed_successfully
    environment:
      - EXPORT_PATH=/shared-certfile
      - SSL_CERT_FILE=/corp/ca/corp-ca.pem
    volumes:
      - corp:/corp:ro
      - ca-certfile:/shared-certfile
    restart: "no"

volumes:
  ca-shared:
  ca-nobundle:
  ca-certdir:
  ca-certfile:
  corp:
