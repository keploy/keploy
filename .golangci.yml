# This is the configuration for golangci-lint for the restic project.
#
# A sample config with all settings is here:
# https://github.com/golangci/golangci-lint/blob/master/.golangci.example.yml
version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
  exclusions:
    # Generated files (any with Go's "Code generated ... DO NOT EDIT." header,
    # such as bpf2go's pkg/agent/hooks/linux/bpf_*_bpfel.go) are never linted.
    # strict is golangci-lint's default, spelled out here. Do not list paths
    # under paths-except: it keeps issues in ONLY the paths it lists and drops
    # every other file's, which is how lint once passed every change.
    generated: strict
    rules: []

# Every issue is listed, so one red round shows them all: by default
# golangci-lint prints only the first 3 issues of the same text, the first 50
# of each linter and one issue per line, and a hidden one only shows up after
# the shown ones are fixed (keploy #5002's served_view.go:98:28). The cost: a
# mistake can show more than once, when two linters or two staticcheck codes
# flag it, or as SA2002's "related information" line once per goroutine.
# gofmt and goimports still report one issue per file; formatting the file
# fixes all of them.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
