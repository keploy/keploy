# This is the configuration for golangci-lint for the restic project.
#
# A sample config with all settings is here:
# https://github.com/golangci/golangci-lint/blob/master/.golangci.example.yml
version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
  exclusions:
    # Generated files (any with Go's "Code generated ... DO NOT EDIT." header,
    # such as bpf2go's pkg/agent/hooks/linux/bpf_*_bpfel.go) are never linted.
    # strict is golangci-lint's default, spelled out here. Do not list paths
    # under paths-except: it keeps issues in ONLY the paths it lists and drops
    # every other file's, which is how lint once passed every change.
    generated: strict
    rules: []

formatters:
  enable:
    - gofmt
    - goimports
