name: setup-java-maven
description: "Set up a Temurin JDK and restore ~/.m2/repository for a Maven build, keyed by the Maven, JDK, configuration and poms; mvn then runs offline on it, and heals it when it falls short"

# In place of actions/setup-java's own `cache: maven`, whose key (OS, arch,
# pom hash) stays the same when the runner image changes its Maven. A local
# repository is only of use to a build that tracks its files the way the one
# that filled it did, so a cache saved by one Maven and restored for another
# can be all "present, but unavailable": every file is fetched from Maven
# Central again, on every run, since a cache entry is never replaced.
#
# Use it with ./.github/actions/setup-java-maven/save as a step after the
# build. In a job that builds twice, put each use right before its own build:
# mvn follows the latest use, and its runs count toward that use's save.
# maven-cache-key.sh says what the key covers, bin/mvn how a restored
# cache is used (offline) and how it heals when it cannot serve the build
# (one online run, then a new entry), and save/save-plan.sh when and under
# which entry the repository is saved.
# Their tests (setup-java-maven.tests.sh) run in the lint workflow.
inputs:
  java-version:
    required: true
    description: "The JDK, as actions/setup-java's java-version takes it"
  cache-dependency-path:
    required: true
    description: "The pom.xml files the build reads its dependencies from, one per line, relative to the workspace"

runs:
  using: composite
  steps:
    # setup-java writes ~/.m2/settings.xml, which the key hashes: it comes first.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Maven repository cache key
      id: key
      shell: bash
      env:
        MAVEN_CACHE_JAVA_VERSION: ${{ inputs.java-version }}
        MAVEN_CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
      run: |
        key=$(bash "$GITHUB_ACTION_PATH/maven-cache-key.sh")
        echo "Maven repository cache key: $key"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # Entries are saved as KEY-<suffix> (save/save-plan.sh), and the newest
    # one of this key is restored: after a heal, the healed one. No entry is
    # ever saved as KEY itself.
    - name: Restore the Maven repository
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.key }}-

    - name: Register the Maven repository for bin/mvn
      shell: bash
      env:
        KEY: ${{ steps.key.outputs.key }}
        MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
      run: bash "$GITHUB_ACTION_PATH/restored.sh"
