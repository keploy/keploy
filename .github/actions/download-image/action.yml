name: pull-image
description: "Download a docker image tarball from a workflow artifact and load it into the local docker daemon."

inputs:
  artifact_name:
    description: "Name of the workflow artifact that holds image.tar (e.g. docker-image-linux-amd64)."
    required: false
    default: docker-image-linux-amd64
  version:
    description: "Version string to tag the loaded image with (ghcr.io/keploy/keploy:v<version>)."
    required: false
    default: 3-dev

runs:
  using: composite
  steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/keploy-image

    # An artifact download can end "successfully" with a truncated file: the
    # blob store closes the connection early and download-artifact reports
    # success on a short read. `docker load` then fails on a tarball it cannot
    # parse --
    #   short read: expected 40205004 bytes but got 22221063: unexpected EOF
    # -- which reads like a corrupt image and fails the job, three steps away
    # from the download that actually went wrong. Seen on the self-hosted macOS
    # runners, where the artifact takes over a minute to pull.
    #
    # So: check the archive is complete, and if it is not, pull it once more
    # before blaming the image. A second short read fails the job, loudly, at
    # the step that owns the problem.
    - name: Check the image tarball is complete (Unix)
      id: check
      if: runner.os != 'Windows'
      shell: bash
      run: |
        TAR="${{ runner.temp }}/keploy-image/image.tar"
        if [ -f "$TAR" ] && tar -tf "$TAR" >/dev/null 2>&1; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::warning::the downloaded image tarball is incomplete or unreadable; downloading it again"
        ls -la "${{ runner.temp }}/keploy-image" 2>/dev/null || true
        rm -rf "${{ runner.temp }}/keploy-image"
        echo "complete=false" >> "$GITHUB_OUTPUT"

    # Same check on Windows, in PowerShell: a composite `shell: bash` step
    # needs Git Bash, which not every self-hosted Windows runner in the fleet
    # has (see the Load image (Windows) step's note on pwsh).
    - name: Check the image tarball is complete (Windows)
      id: checkwin
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Statements, not an expression: `(cmd; $LASTEXITCODE -eq 0)` inside an
        # `if (...)` is a PowerShell parse error, not a test.
        $tar = Join-Path "${{ runner.temp }}" "keploy-image\image.tar"
        $complete = $false
        if (Test-Path $tar) {
          tar -tf $tar *> $null
          $complete = ($LASTEXITCODE -eq 0)
        }
        if ($complete) {
          "complete=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }
        Write-Host "::warning::the downloaded image tarball is incomplete or unreadable; downloading it again"
        Remove-Item -Recurse -Force (Join-Path "${{ runner.temp }}" "keploy-image") -ErrorAction SilentlyContinue
        "complete=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Download image artifact (second attempt)
      if: steps.check.outputs.complete == 'false' || steps.checkwin.outputs.complete == 'false'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/keploy-image

    - name: Check the image tarball is complete (second attempt, Unix)
      if: steps.check.outputs.complete == 'false'
      shell: bash
      run: |
        TAR="${{ runner.temp }}/keploy-image/image.tar"
        if [ -f "$TAR" ] && tar -tf "$TAR" >/dev/null 2>&1; then
          echo "The second download is complete."
          exit 0
        fi
        echo "::error::the image artifact ${{ inputs.artifact_name }} downloaded incomplete twice"
        ls -la "${{ runner.temp }}/keploy-image" 2>/dev/null || true
        exit 1

    - name: Check the image tarball is complete (second attempt, Windows)
      if: steps.checkwin.outputs.complete == 'false'
      shell: powershell
      run: |
        $tar = Join-Path "${{ runner.temp }}" "keploy-image\image.tar"
        $complete = $false
        if (Test-Path $tar) {
          tar -tf $tar *> $null
          $complete = ($LASTEXITCODE -eq 0)
        }
        if ($complete) {
          Write-Host "The second download is complete."
          exit 0
        }
        Write-Host "::error::the image artifact ${{ inputs.artifact_name }} downloaded incomplete twice"
        Get-ChildItem (Join-Path "${{ runner.temp }}" "keploy-image") -Force -ErrorAction SilentlyContinue
        exit 1

    # The image is loaded into the LOCAL docker daemon below. On Docker Desktop
    # runners (Windows / macOS) the daemon may still be starting when this action
    # runs, so `docker load` fails with "failed to connect to the docker API ...
    # the daemon is running" (a startup race, not a real fault). Wait for the
    # daemon to answer before loading. Linux runners have systemd Docker already
    # up, so this returns on the first attempt.
    - name: Wait for the Docker daemon (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then
            echo "Docker is ready after $i attempt(s)"
            exit 0
          fi
          echo "Waiting for Docker... attempt $i/30"
          sleep 2
        done
        echo "::error::Docker daemon did not become ready within 60s"
        docker info 2>&1 | head -20 || true
        exit 1

    - name: Wait for the Docker daemon (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $maxAttempts = 30
        $attempt = 0
        while ($attempt -lt $maxAttempts) {
          $attempt++
          try {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker is ready after $attempt attempt(s)"
              exit 0
            }
          } catch {}
          Write-Host "Waiting for Docker... attempt $attempt/$maxAttempts"
          Start-Sleep -Seconds 2
        }
        Write-Host "::error::Docker daemon did not become ready within 60s"
        # Mirror the Unix path's diagnostics so a genuinely-down daemon or the
        # wrong (Windows vs Linux) engine context is actionable from the log.
        # `docker context ls` works without the daemon and reveals whether the
        # Linux engine the load targets is even selected.
        Write-Host "docker context ls:"
        docker context ls 2>&1 | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
        Write-Host "docker info:"
        docker info 2>&1 | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
        exit 1

    - name: Load image (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        TAR="${{ runner.temp }}/keploy-image/image.tar"
        if [ ! -f "$TAR" ]; then
          echo "::error::expected image tarball at $TAR"
          ls -la "${{ runner.temp }}/keploy-image" || true
          exit 1
        fi
        echo "Loading image from $TAR ..."
        # Run docker load exactly once: a second invocation for the
        # diagnostic path would re-import the image and (piped through
        # `head` under pipefail) risks SIGPIPE aborting the step
        # before the ::error:: line is emitted. Capture stdout+stderr
        # in one go and reuse the buffer for both parsing and
        # diagnostics.
        if ! LOAD_OUTPUT=$(docker load -i "$TAR" 2>&1); then
          LOAD_OUTPUT_ONE_LINE=$(printf '%s' "$LOAD_OUTPUT" | tr '\n' '; ')
          echo "::error::docker load failed for $TAR: $LOAD_OUTPUT_ONE_LINE"
          exit 1
        fi
        # Anchor to "Loaded image: " (with the trailing space) so the
        # `Loaded image ID: sha256:…` variant emitted when the tarball
        # has no RepoTags doesn't match and silently yield `sha256` as
        # the tag target. `exit` after the first match keeps selection
        # deterministic without a `head -n1` pipeline (and without
        # restricting to line 1 — docker load may print a leading
        # "Loaded from disk"-style status line before the tag line).
        LOADED=$(printf '%s\n' "$LOAD_OUTPUT" | awk -F'Loaded image: ' '/^Loaded image: / {print $2; exit}')
        if [ -z "$LOADED" ]; then
          LOAD_OUTPUT_ONE_LINE=$(printf '%s' "$LOAD_OUTPUT" | tr '\n' '; ')
          echo "::error::docker load completed but did not report a tagged image (tarball may be missing RepoTags): $LOAD_OUTPUT_ONE_LINE"
          exit 1
        fi
        echo "Loaded: $LOADED"
        docker tag "$LOADED" "ghcr.io/keploy/keploy:v${{ inputs.version }}"
        docker images | awk 'NR==1 || /keploy\/keploy/ {print}'
        echo "Image architecture:"
        docker image inspect "$LOADED" --format '{{.Os}}/{{.Architecture}}' || true

    - name: Load image (Windows)
      if: runner.os == 'Windows'
      # Use Windows PowerShell 5.1 (always preinstalled on Windows
      # runners) rather than pwsh (PowerShell 7, which not every
      # self-hosted runner in the fleet ships — see the Bootstrap
      # PowerShell environment step in prepare_and_run.yml's
      # build-windows-amd64 job, which repairs *that* job but does
      # not run in the pull-docker-image-windows job that invokes
      # this action). Every cmdlet used below (Join-Path, Test-Path,
      # Get-ChildItem, Select-String, [Environment]::NewLine,
      # string .Trim(), [string]::IsNullOrWhiteSpace) is 5.1-
      # compatible, so keeping the floor at 5.1 is free and avoids
      # a 'pwsh: command not found' step failure on unrepaired
      # runners.
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $tar = Join-Path "${{ runner.temp }}" "keploy-image\image.tar"
        if (-not (Test-Path $tar)) {
          Write-Error "expected image tarball at $tar"
          Get-ChildItem (Join-Path "${{ runner.temp }}" "keploy-image") -Force -ErrorAction SilentlyContinue
          exit 1
        }
        Write-Host "Loading image from $tar ..."
        # Capture stdout + stderr together and check $LASTEXITCODE
        # explicitly: without 2>&1 an error from docker.exe goes to
        # stderr (not into $loadOutput) and PowerShell's $ErrorAction
        # does not pick up native-command exit codes, so a genuine
        # load failure would fall through to the "no tagged image"
        # branch below and surface with empty diagnostics. Explicit
        # exit-code handling keeps the failure reason in the error.
        $loadOutput = docker load -i $tar 2>&1
        if ($LASTEXITCODE -ne 0) {
          $combined = ($loadOutput | Out-String).Trim()
          Write-Error "docker load failed for $tar (exit $LASTEXITCODE): $combined"
          exit 1
        }
        # Anchor at line start and trim the capture — docker CLI on
        # Windows emits CRLF, which `(.+)$` would swallow into the
        # capture group, yielding a trailing \r that makes
        # `docker tag` reject the reference. Trim() strips both CR
        # and any trailing whitespace.
        $match = $loadOutput | Select-String -Pattern '^Loaded image:\s+(.+)$' | Select-Object -First 1
        if ($null -eq $match) {
          $combined = ($loadOutput | Out-String).Trim()
          Write-Error "docker load completed but did not report a tagged image (tarball may be missing RepoTags). Output: $combined"
          exit 1
        }
        $loaded = $match.Matches.Groups[1].Value.Trim()
        if ([string]::IsNullOrWhiteSpace($loaded)) {
          $combined = ($loadOutput | Out-String).Trim()
          Write-Error "docker load reported an empty image reference. Output: $combined"
          exit 1
        }
        Write-Host "Loaded: $loaded"
        docker tag $loaded "ghcr.io/keploy/keploy:v${{ inputs.version }}"
        docker images --format "{{.Repository}}:{{.Tag}}" | Select-String -Pattern "keploy/keploy" -SimpleMatch
