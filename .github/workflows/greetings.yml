name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      continue-on-error: true
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Thank you and congratulations 🎉 for opening your very first issue in keploy'
        pr-message: 'Thank you and congratulations 🎉 for opening your very first pull request in keploy'
