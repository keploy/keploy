name: Repeated Headers Replay (Linux)
# Guard: replay sends a recorded header on the lines it arrived on. A test
# whose client sent `X_tenant: acme` twice used to replay as one folded
# `X_tenant: acme,acme` line, which the app's validation rejects, and a mock
# whose dependency answered with two Set-Cookie lines served them as one
# cookie.
#
# The matrix runs the same record -> replay against two keploy binaries:
#   - build  -> the PR's binary. MUST pass.
#   - latest -> the published `latest`. Fails until a release carries the
#               fix: it has no line lengths to replay from. continue-on-error
#               so it documents the bug without blocking; drop the leg once
#               `latest` has the fix.
on:
  workflow_call:
    inputs:
      runner:
        description: 'The type of runner to use for this job'
        type: string
        required: false
        default: 'ubuntu-latest'
      jobs_to_run:
        description: 'Controls which jobs to run. "all" runs everything.'
        type: string
        required: false
        default: 'all'

jobs:
  repeated_headers_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - job: record_build_replay_build
            src: build
            continue_on_error: false
          - job: record_latest_replay_latest
            src: latest
            continue_on_error: true
    name: repeated-headers (${{ matrix.config.job }})
    timeout-minutes: 15
    continue-on-error: ${{ matrix.config.continue_on_error }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: ${{ matrix.config.src }}

      - name: Run repeated-headers guard
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.record.outputs.path }}
        # `bash <script>` (not `source`) so the script's intentional `set +e`
        # is not overridden by the step's default `-eo pipefail`.
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/repeated-headers/python-linux.sh"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeated-headers-${{ matrix.config.job }}-logs
          path: |
            .github/workflows/test_workflow_scripts/python/repeated-headers/*.txt
            .github/workflows/test_workflow_scripts/python/repeated-headers/keploy/
          if-no-files-found: warn
          retention-days: 7
