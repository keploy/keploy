name: Go-Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  test:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: go-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1" # Enable CGO for this job
      # This lane PROVIDES the MySQL below, so it is the one lane entitled to
      # fail when the server is missing. The real-server tests key their hard
      # failure on this var rather than on the generic CI var: CI is set by
      # every GitHub Actions run, including forks and lanes that promise no
      # database, so keying on it would turn an unrelated contributor's PR red
      # over a service they were never offered. Unset, the tests skip.
      KEPLOY_TEST_MYSQL_REQUIRED: "1"
      # Same shape, different resource: the proxy's loopback address-family
      # fallback tests need ::1 on lo. Without this they SKIP and the package
      # still reports ok — a suite that tests nothing while looking healthy,
      # which is the exact failure the fallback itself exists to prevent.
      # Unlike MySQL this is not a service the lane provides, it is a property
      # of the runner; every GitHub-hosted ubuntu image has ::1 on lo, so this
      # only fires if that stops being true, and it stays unset elsewhere so a
      # v6-less environment skips rather than fails.
      KEPLOY_TEST_IPV6_REQUIRED: "1"
      # And for user namespaces, which this lane lets unprivileged users
      # create (the step before the unit tests). utils' test of the process
      # tree InterruptProcessTree signals starts a process in a nested pid
      # namespace under `unshare --user`, the one real check that it never
      # signals pid 1; without user namespaces it skips, and the package
      # still reports ok. With this set it fails instead.
      KEPLOY_TEST_USERNS_REQUIRED: "1"
      # The tests that hold processes off the CPU (internal/starvetest: 32
      # hogs pinned to one CPU) or spin one run where this says the host is
      # one for them, and skip elsewhere, so that a routine `go test` of
      # utils or pkg/platform/http on a developer's machine pins no CPU.
      # This lane is where they run.
      KEPLOY_TEST_CPU_HOLD: "1"
      # utils' tests of a stop's storage I/O read a file from storage, out of
      # the page cache; where no read reaches storage (both test dirs in
      # memory) they skip. This runner's disks take them: with this set they
      # fail instead.
      KEPLOY_TEST_STORAGE_IO_REQUIRED: "1"
      KEPLOY_TEST_MYSQL_ADDR: "127.0.0.1:3306"
      KEPLOY_TEST_MYSQL_USER: root
      KEPLOY_TEST_MYSQL_PASS: rootpass
      KEPLOY_TEST_MYSQL_DB: sampledb
    permissions:
      contents: read
      packages: write
      id-token: write

    # The MySQL V2 record path is the one place keploy terminates TLS on
    # BOTH sides of a connection it is also parsing, and its client-write
    # hold is only observable against a server that actually speaks the
    # protocol: a scripted peer accepts a leaked ClientHello that a real
    # mysqld rejects. mysql:8.0 generates its own certs at init, so
    # have_ssl is YES with no extra configuration.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: sampledb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false     
      
      - name: Installing build Essentials and gcc
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/apt-install.sh" build-essential gcc libc-dev \
            pkg-config \
            libgl1-mesa-dev          \
            libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev \
            libxxf86vm-dev libx11-dev libx11-xcb-dev  

      - name: Install dependencies
        run: |
          # `cache: false` above means this lane re-downloads keploy's whole
          # module graph on every run, before every test in this job.
          source "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/go-retry.sh"
          go_retry get .
          # `go get .` resolves the main module's NON-test import graph. The two
          # test steps additionally load github.com/go-sql-driver/mysql and its
          # dependency filippo.io/edwards25519, and neither step can be wrapped
          # (go-retry.sh forbids wrapping `go test`), so a transient proxy error
          # while those resolve kills the job unretried. Measured by evicting
          # both from GOMODCACHE: `go get .` leaves them absent, and
          # `go list -deps -test ./...` extracts exactly those two.
          # `go list -deps -test` rather than `go mod download` is a preference,
          # not a correctness point — both warm what the test steps need, and
          # both leave go.sum byte-identical (measured +0 lines, 3/3 trials; the
          # command that does rewrite go.sum is `go mod download all`, which is
          # not this). `go list` warms only what these steps load and picks up
          # new test-only deps by itself.
          go_retry list -deps -test ./... > /dev/null

      # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor
      # by default (kernel.apparmor_restrict_unprivileged_userns=1), so
      # `unshare --user` fails there (actions/runner-images#10443). Lift that
      # for this job, which promises user namespaces to the tests
      # (KEPLOY_TEST_USERNS_REQUIRED above). A runner without the setting
      # fails this step, and the lane's promise has to be looked at again.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # KEPLOY_TEST_REAL_DOCKER lets the rows that start containers on the
      # runner's daemon run (a real `docker compose` child's output kept in
      # the attach tail); a plain `go test` anywhere else skips them.
      - name: Running Unit Tests
        env:
          KEPLOY_TEST_REAL_DOCKER: "1"
        run: go test ./...

      # Most of the learn package's rows read a cache no tracker made, and
      # payloads read whole, while keploy reads a set's caches (setDerived)
      # and lazy payloads (LazyRawOf). Its TestMain runs every row in those
      # shapes too: KEPLOY_LEARN_SET_EVERY_CACHE gives every NewDriftCache a
      # set cache of its own, KEPLOY_LEARN_LAZY_EVERY_RAW makes every RawOf a
      # lazy Raw read again at each use. A part of a recording the set keeps
      # under another part's key, or a rule reading a payload past its
      # accessor, passes the plain run above and fails one of these. Under
      # the proven switch, as keploy's learn step runs (the plain run above
      # has it off).
      - name: Running Unit Tests (learn, every cache a set's, every payload lazy)
        run: |
          KEPLOY_PROVEN=1 KEPLOY_LEARN_SET_EVERY_CACHE=1 go test -count=1 ./pkg/matcher/learn/
          KEPLOY_PROVEN=1 KEPLOY_LEARN_LAZY_EVERY_RAW=1 go test -count=1 ./pkg/matcher/learn/

      # The learn step's tracker is told of serves and exchanges on the
      # adapters' connection goroutines while other connections' calls read
      # it (Placed, Order.ServedView, a late exchange's view), and one set's
      # handlers read its caches at once (DriftCache, the set's derived data).
      # A read outside the tracker's or the set's lock is a data race that a
      # plain run passes. Race the rows of the tracker, of its Order and of
      # the set's handlers, and the rows that wait on the tracker, not the
      # whole package: under -race the package takes about 9 minutes on 12
      # CPUs, these 27 rows about 25 seconds on 4 (the size of ubuntu-latest).
      - name: Running Race Detector (learn tracker)
        run: go test -race -count=1 -run '^Test(Tracker|Order)|DriftCache|Handlers|^TestACallInTheGapWaitsForTheRequest$|^TestAWindowClosedWithoutItsRequestIsSaid$' ./pkg/matcher/learn/

      # The HTTP learn step's bound row holds its peak heap to the set's
      # budget, a quarter of the agent's memory limit, at three limits. The
      # plain run above takes the 256 MiB limit alone, which streams four
      # times its budget; the 512 MiB and 1 GiB limits' legs run only with
      # KEPLOY_LARGE_STREAM_MIB set, here, at the same 256 MiB stream, so the
      # package's own run (and the Windows lane's) stays short. Each leg's
      # PASS line is grepped, so a leg that skips or is renamed away fails
      # the step.
      - name: Running the HTTP learn bound row at its larger memory limits
        shell: bash
        run: |
          set -o pipefail
          KEPLOY_LARGE_STREAM_MIB=256 go test -count=1 -timeout 20m -v \
            -run '^TestLearnMatchReadsTheRecordingsBeforeACallWithinTheSetsBudget$/^(512|1024)_MiB_limit_' \
            ./pkg/agent/proxy/integrations/http/ | tee /tmp/http-learn-bound.out
          for leg in 512_MiB_limit_on_disk 512_MiB_limit_staged 1024_MiB_limit_on_disk 1024_MiB_limit_staged; do
            grep -q -- "--- PASS: TestLearnMatchReadsTheRecordingsBeforeACallWithinTheSetsBudget/$leg " /tmp/http-learn-bound.out ||
              { echo "the bound row's $leg leg did not pass"; exit 1; }
          done

      # utils' TestMarkExitCountsOpenFilesNotDescriptors compares a child's
      # descriptors with kcmp(2), which the kernel may refuse the runner user
      # (another process's files need PTRACE_MODE_READ_REALCREDS). Where it
      # refuses, the row holds keploy to counting each descriptor and saying
      # why, and logs why the kernel refused: run here with -v so that reason
      # is in the log, even where the unit run above failed. Run again as
      # root with KEPLOY_TEST_KCMP_REQUIRED=1, which fails it where the kernel
      # refuses, so the comparison itself runs on every PR. Beside it, the
      # rows of a child reaped before its files are compared (required to
      # compare as root too) and of a process read through threads that exit
      # (it builds a C program; a runner with no cc fails the step). Each leg runs
      # whether or not the one before it passed or built (a leg's failure is
      # in its output, not the shell's -e and pipefail), so one run says both
      # answers; each PASS line is grepped at the end, so a row that fails,
      # does not build or vanishes fails the step. Each run passes
      # -test.timeout, as go test does: a test binary run with none has no
      # deadline, and these rows bound their waits by the test's deadline, so a
      # hang fails naming what it waited on instead of running to the job's end.
      - name: Open-file rows as the runner user and as root
        if: success() || failure()
        shell: bash
        run: |
          rm -f /tmp/utils.test /tmp/http.test
          failed=0
          go test -c -o /tmp/utils.test ./utils/ || failed=1
          go test -c -o /tmp/http.test ./pkg/platform/http/ || failed=1
          cd utils
          rows='^(TestMarkExitCountsOpenFilesNotDescriptors|TestAChildReapedBeforeItsFilesAreComparedIsNoRefusal|TestAReadThroughExitingThreadsNeverSettlesLow)$'
          /tmp/utils.test -test.count=1 -test.v -test.timeout=10m -test.run "$rows" | tee /tmp/utils-runner.out || true
          sudo env KEPLOY_TEST_KCMP_REQUIRED=1 /tmp/utils.test -test.count=1 -test.v -test.timeout=10m -test.run "$rows" | tee /tmp/utils-root.out || true
          # The churning daemon's stop, which reads its files the same way.
          cd ../pkg/platform/http
          /tmp/http.test -test.count=1 -test.v -test.timeout=10m -test.run '^TestADaemonThatOnlyChurnsMovesNoTeardown$' | tee /tmp/http-runner.out || true
          sudo env KEPLOY_TEST_KCMP_REQUIRED=1 /tmp/http.test -test.count=1 -test.v -test.timeout=10m -test.run '^TestADaemonThatOnlyChurnsMovesNoTeardown$' | tee /tmp/http-root.out || true
          for leg in {utils-runner,utils-root}:{TestMarkExitCountsOpenFilesNotDescriptors,TestAChildReapedBeforeItsFilesAreComparedIsNoRefusal,TestAReadThroughExitingThreadsNeverSettlesLow} \
            http-runner:TestADaemonThatOnlyChurnsMovesNoTeardown http-root:TestADaemonThatOnlyChurnsMovesNoTeardown; do
            out=/tmp/${leg%%:*}.out
            grep -q -- "^--- PASS: ${leg#*:} " "$out" || { echo "${leg#*:} did not pass in $out"; failed=1; }
          done
          exit "$failed"

      # internal/starvetest's hold gives the threads it let go their policy
      # back, where the kernel lets it: from the idle policy, the runner user
      # gets back only what RLIMIT_NICE allows (nothing, by default), so its
      # run checks their CPUs alone. Run as root with
      # KEPLOY_TEST_POLICY_RESTORE_REQUIRED=1, which fails it where the
      # kernel would not, so the policy given back is checked on every PR.
      - name: Hold row as root
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          rm -f /tmp/starvetest.test
          go test -c -o /tmp/starvetest.test ./internal/starvetest/
          cd internal/starvetest
          sudo env KEPLOY_TEST_CPU_HOLD=1 KEPLOY_TEST_POLICY_RESTORE_REQUIRED=1 /tmp/starvetest.test -test.count=1 -test.v -test.run '^TestAHoldLetsItsProcessesRunAsBefore$' | tee /tmp/starvetest-root.out
          grep -q -- '^--- PASS: TestAHoldLetsItsProcessesRunAsBefore ' /tmp/starvetest-root.out

      # The hooks package's root tests skip in the run above, which is the
      # runner user's: TestTheHooksLoadOnThisKernel loads the agent's eBPF
      # objects against this kernel's BTF, as the agent does, and
      # TestTracefsMountedAgreesWithCiliumInEveryLayout holds tracefsMounted to
      # cilium/ebpf's own tracefs lookup in five mount layouts, each built in a
      # mount namespace of its own, and TestTheClientsRegistrationKeepsItsPIDNamespace
      # holds RegisterClient, which needs a kernel map, to keeping the pid
      # namespace the CLI said. Built as the runner user, run as root, and
      # each PASS line grepped, so a test or layout that skips or vanishes
      # fails the step.
      - name: Hooks tests as root
        shell: bash
        run: |
          go test -c -o /tmp/hooks-linux.test ./pkg/agent/hooks/linux/
          cd pkg/agent/hooks/linux
          sudo /tmp/hooks-linux.test -test.count=1 -test.v -test.run '^(TestTheHooksLoadOnThisKernel|TestTracefsMountedAgreesWithCiliumInEveryLayout|TestTheClientsRegistrationKeepsItsPIDNamespace)$' | tee /tmp/hooks-linux.out
          for t in TestTheHooksLoadOnThisKernel TestTracefsMountedAgreesWithCiliumInEveryLayout TestTheClientsRegistrationKeepsItsPIDNamespace \
            TestTracefsMountedAgreesWithCiliumInEveryLayout/{none,canonical,elsewhere,subdir,debugfs}; do
            grep -q -- "--- PASS: $t " /tmp/hooks-linux.out || { echo "$t did not pass as root"; exit 1; }
          done

      # The compose library is behind the `composelib` build tag, so the plain
      # run above exercises the SHELL-OUT path and never the library. Its own
      # tests — and the App call sites that choose between the two — would go
      # uncovered on every PR without this second run.
      #
      # Scoped to the two packages that have tagged tests rather than ./... ,
      # because everything else is identical in both shapes and would just be
      # run twice.
      #
      # Under -race: compose writes what it reports from several goroutines
      # (the app's log streams, its container monitor), so a writer that is
      # not safe for that is a data race the plain run passes. The live tests
      # had one in their own buffers until they moved to syncBuffer.
      - name: Running Unit Tests (compose library)
        run: go test -race -tags composelib -count=1 ./pkg/client/app/... ./pkg/platform/docker/...

      # The mock-manager's concurrency guards — the match-count race and the
      # hitMu/treesMu lock order — are only meaningful under -race: without
      # it their tests pass on a build that races, so they read as coverage
      # while proving nothing. That applies past the mock manager: util/ keeps the
      # loopback fallback's process-wide atomic.Bool, and syncMock, supervisor and
      # tls ship eight tests with Race/Concurrent/Deadlock in their names. Naming
      # packages here left those eight raced by nothing, so race the whole subtree
      # instead — it is not slower in any way that matters, because package tests
      # run in parallel: measured 43s for all 29 packages against 40.5s for
      # ./pkg/agent/proxy/ alone, which dominates either way.
      #
      # The proxy's store of the names a docker replay's networks answer lives
      # in pkg/agent/netnames, and the agent's routes fill it: its waiters rely
      # on each change closing a channel under the store's lock, and a close
      # moved outside the lock passes a plain run while it can panic the agent
      # with "close of closed channel". Only -race sees it, so race both too.
      - name: Running Race Detector (agent proxy)
        run: go test -race -count=1 ./pkg/agent/proxy/... ./pkg/agent/netnames/... ./pkg/agent/routes/...

      # Same argument, different subtree: pkg/agent/token holds the
      # control-plane token behind a mutex that Session and Adopt share, and a
      # reader that slipped between them would hand the agent an empty token
      # and serve the whole control plane unauthenticated. Plain `go test`
      # cannot see that — the guard's absence is a data race, not a failed
      # assertion — so the test that covers it only proves anything here.
      - name: Running Race Detector (agent control-plane token)
        run: go test -race -count=1 ./pkg/agent/token/...

      # Same argument for replay: its test-set loop runs the application, its
      # watcher and the tests on goroutines of their own, and one defect its
      # tests pin is a data race: the teardown closed a channel the app watcher
      # sends on, after a drain that had given up on the app. Plain `go test`
      # passes a race by, so TestRunTestSetDrainThatGivesUpLeavesTheWatcherAlone
      # proves something only here. The whole package, not the tests named
      # for that loop, so the rest of its concurrency is raced too. Measured
      # under -race: 4m09s on 14 cores and 6m22s with the test binary pinned to
      # 4 CPUs (the size of ubuntu-latest), with no race. -timeout 20m gives
      # that run about three times its 4-CPU time before go test calls it
      # hung; the default 10m gives it less than twice.
      - name: Running Race Detector (replay)
        run: go test -race -count=1 -timeout 20m ./pkg/service/replay/
