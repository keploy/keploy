name: Go-Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  test:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: go-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1" # Enable CGO for this job
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false     
      
      - name: Installing build Essentials and gcc
        run: |
          sudo timeout 600 apt-get -y update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
          sudo timeout 600 apt-get -y install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 build-essential gcc libc-dev  \
            pkg-config \
            libgl1-mesa-dev          \
            libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev \
            libxxf86vm-dev libx11-dev libx11-xcb-dev  

      - name: Install dependencies
        run: go get .

      - name: Running Unit Tests
        run: go test ./...

      # The mock-manager's concurrency guards — the tier-key/HitCount race and
      # the hitMu/treesMu lock order — are only meaningful under -race: without
      # it their tests pass on a build that races, so they read as coverage
      # while proving nothing. Scoped to this package rather than the whole
      # tree to keep the lane fast.
      - name: Running Race Detector (agent proxy)
        run: go test -race -count=1 ./pkg/agent/proxy/
