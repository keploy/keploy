name: Go-Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  test:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: go-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1" # Enable CGO for this job
      # This lane PROVIDES the MySQL below, so it is the one lane entitled to
      # fail when the server is missing. The real-server tests key their hard
      # failure on this var rather than on the generic CI var: CI is set by
      # every GitHub Actions run, including forks and lanes that promise no
      # database, so keying on it would turn an unrelated contributor's PR red
      # over a service they were never offered. Unset, the tests skip.
      KEPLOY_TEST_MYSQL_REQUIRED: "1"
      KEPLOY_TEST_MYSQL_ADDR: "127.0.0.1:3306"
      KEPLOY_TEST_MYSQL_USER: root
      KEPLOY_TEST_MYSQL_PASS: rootpass
      KEPLOY_TEST_MYSQL_DB: sampledb
    permissions:
      contents: read
      packages: write
      id-token: write

    # The MySQL V2 record path is the one place keploy terminates TLS on
    # BOTH sides of a connection it is also parsing, and its client-write
    # hold is only observable against a server that actually speaks the
    # protocol: a scripted peer accepts a leaked ClientHello that a real
    # mysqld rejects. mysql:8.0 generates its own certs at init, so
    # have_ssl is YES with no extra configuration.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: sampledb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false     
      
      - name: Installing build Essentials and gcc
        run: |
          sudo timeout 600 apt-get -y update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120
          sudo timeout 600 apt-get -y install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 build-essential gcc libc-dev  \
            pkg-config \
            libgl1-mesa-dev          \
            libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev \
            libxxf86vm-dev libx11-dev libx11-xcb-dev  

      - name: Install dependencies
        run: go get .

      - name: Running Unit Tests
        run: go test ./...

      # The mock-manager's concurrency guards — the tier-key/HitCount race and
      # the hitMu/treesMu lock order — are only meaningful under -race: without
      # it their tests pass on a build that races, so they read as coverage
      # while proving nothing. Scoped to this package rather than the whole
      # tree to keep the lane fast.
      - name: Running Race Detector (agent proxy)
        run: go test -race -count=1 ./pkg/agent/proxy/
