name: Go on Windows

on:
  pull_request:
    branches: [ main ]

jobs:

  build:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build amd64
        run: |
          set GOARCH=amd64
          go build -v ./...
        shell: cmd

      - name: Build arm64
        run: |
          set GOARCH=arm64
          go build -v ./...
        shell: cmd

      # This repository has never run a Go test on Windows - this job only
      # ever compiled. That is how a whole class of bug survived unnoticed:
      # Go's syscall.ECONNRESET / ECONNREFUSED / ECONNABORTED / EPIPE are
      # APPLICATION_ERROR-space values on Windows that Winsock never returns
      # and syscall.Errno.Is does not map, so every predicate written against
      # them was silently inert on this platform. pkg/neterr classifies those
      # correctly, and its tests drive real sockets rather than synthetic
      # errno values - which means they only prove anything when they run
      # here, on Windows.
      #
      # Package selection, in order of what it buys:
      #   ./pkg               IsTransportConnReset and the connection-refused
      #                       retry live here, and they are called from
      #                       pkg/service/replay with no build tag - this is
      #                       the code that genuinely runs natively on Windows.
      #                       It also already holds a real-socket
      #                       connection-refused test.
      #   ./pkg/neterr        the classification itself.
      #   .../proxy/incoming  isStaleConnError, which decides whether an
      #                       idempotent request is redialed and replayed or
      #                       turned into a 502 for the user's application.
      #   .../integrations/http  the recorded-upstream-error markers.
      #   .../proxy/connseq   the proxy's end of its connection to a
      #                       destination (Upstream), which numbers the chunks
      #                       of both directions. Off Linux it asks the socket
      #                       for no count (received_others.go).
      #                       upstream_others_test.go checks that no socket is
      #                       asked and builds only off Linux, so only this job
      #                       and the macOS one can run it; upstream_test.go
      #                       checks the numbering by what was read. Neither
      #                       had run on Windows before this job.
      #   .../proxy/supervisor  the session's record of how each end of a
      #                       connection ended: a client socket's Winsock
      #                       reset or broken pipe kept as syscall.ECONNRESET
      #                       or syscall.EPIPE for the parsers
      #                       (client_end_windows.go). Its Windows rows keep
      #                       the errors real loopback sockets gave and run
      #                       only here.
      #   .../proxy/relay     which chunks of an answer the client took before
      #                       it closed or reset, judged from the client
      #                       socket's TCP_INFO_v0 (SIO_TCP_INFO,
      #                       client_socket_windows.go). Its real-socket rows
      #                       drive loopback clients that half-close, reset,
      #                       or stop reading until their receive window
      #                       closes, so they prove the Windows reading only
      #                       when they run here.
      #   ./internal/testnet  the ports ./pkg, ./pkg/neterr and
      #                       ./pkg/agent/proxy/incoming take for their
      #                       refused dials and their listeners. Their
      #                       RefusedAddr ports are held by a connection's
      #                       local end here, whose socket binds the port
      #                       exclusively (SO_EXCLUSIVEADDRUSE). Their
      #                       SharedPort and ReservedPort ports are not held:
      #                       they are ports below the dynamic port range,
      #                       claimed by a lock file per port, which no bind
      #                       to port 0 and no connect is given.
      #                       Its rows check that a held port refuses a dial
      #                       and that no other socket can bind it, that a
      #                       claimed port refuses a dial until the test's
      #                       own listener opens there, and that a claim
      #                       takes a port no other test claimed below the
      #                       range netsh reports.
      #
      # Every one of these but connseq was cross-compiled and executed on a
      # real Windows host before being listed. No Windows host was at hand for
      # connseq: it was listed after its windows/amd64 test binary ran under
      # Wine 10.0, where every test passes and a socketCounterOf that returns a
      # counter fails four of them. Nor for testnet: no Windows host and no
      # Wine was at hand, and ./pkg, ./pkg/neterr and incoming already hold
      # their ports through it here, so its rows are listed to run where its
      # callers do; this job is where they run on Windows.
      #
      # pkg/agent/proxy is deliberately NOT here: two of its tests read a
      # source file by relative path, so I could not separate "fails on
      # Windows" from "fails in my harness" and will not add a package on a
      # guess. Widen this list as packages are shown to pass here, not
      # speculatively.
      #
      # One `go test` invocation with several patterns, not several joined by
      # &&: under `shell: cmd` a multi-line block is a batch file that does not
      # stop on failure and reports only the last exit code.
      - name: Test amd64
        run: go test -count=1 ./pkg/ ./pkg/neterr/... ./pkg/agent/proxy/incoming/... ./pkg/agent/proxy/integrations/http/... ./pkg/agent/proxy/connseq/... ./pkg/agent/proxy/supervisor/ ./pkg/agent/proxy/relay/ ./internal/testnet/
        shell: cmd

      # The count of writes the proxy puts over every accepted client socket
      # (relay.CountClientWrites, under the tracking), which the relay's
      # closed-window rows above read on Windows: every site that keys or
      # reads the accepted socket finds it under the count, whether the proxy
      # keeps the connection, pairs it, both or neither. Only these two rows
      # of ./pkg/agent/proxy/ run here: the package as a whole is not listed
      # above (see its line).
      - name: Test the proxy's count of accepted sockets (amd64)
        run: go test -count=1 -run "^(TestTheAcceptedSocketIsFoundUnderTheCountOfWrites|TestEveryAcceptedSocketIsCountedWhetherKeptOrPaired)$" ./pkg/agent/proxy/
        shell: cmd

      # The Windows stop of a native app (utils.interruptProcessTree): one that
      # had to force-kill the app says so, so a test set's end it cut is not
      # judged (P101-b-o). It takes ~30 s, most of it the stop's own 10 s
      # grace and its PowerShell process checks. The stop reaches a Go app's
      # os.Interrupt, with no kill, from a keploy on a console and from one on
      # none (started detached or as a service), two sends at once included.
      # And the check every command makes that its working directory is
      # still there (GetLastDirectory), which must answer the directory a
      # Windows run is in. Only these tests of ./utils/ run here: the package
      # as a whole has not been shown to pass on Windows.
      - name: Test the Windows stop and working directory (amd64)
        run: go test -count=1 -v -run "TestTheWindowsStopSaysItKilled|TestOnWindowsKeploysStopReaches|TestGetLastDirectory" ./utils/
        shell: cmd

      # The run's log on Windows: a full log is sealed with the read-only
      # attribute through its handle, by whichever of the CLI and its native
      # agent fills it, and closing a log twice is a no-op (a closed file's
      # Stat is an error of its own here, not os.ErrClosed). These rows are
      # the only ones of ./utils/log/ that run here: the package's other
      # tests are Unix-only or have not been shown to pass on Windows. They
      # were added with the code they test, which no Windows host or Wine was
      # at hand to run, so this job is their first Windows run.
      - name: Test the run's log (amd64)
        run: go test -count=1 -run "TestTheRunsLog|TestCloseLogFileOfAClosedLogIsANoOp|TestCloseLogFileLeavesAFileThatIsNotALog" ./utils/log/
        shell: cmd

      # The claim's reads of the calling process on Windows, all without
      # elevation: the owner of a connection's client end, from the system's
      # TCP tables (GetExtendedTcpTable); a process's creation time, and that
      # one that has exited is gone while a handle still keeps it
      # (procStart); and its parent chain (procDescends). The table layout and
      # the chain rule are also tested on every system (caller_tcptable_test,
      # claimer_chain_test); only here do the system's own tables and
      # processes feed them. The claim row has a child claim over HTTP and
      # checks that the agent names the child; the exported-reads row reads
      # a claiming child as a conformance check of an integration does
      # (CallerPID, ProcStart, ProcAlive), while it runs and once it exited.
      - name: Test the claim's process reads (amd64)
        run: go test -count=1 -run "TestTheClaimReadsTheCallerFromTheConnection|TestTheExportedReads|TestCallerPID|TestSameEndpoint|TestTCPOwnerOnWindows|TestTheWindowsTCP|TestWindowsProc|TestDescendsByCreation" ./pkg/agent/routes/ ./pkg/service/agent/
        shell: cmd

      # The proxy's count of its accepts on Windows. listenerDrops is 0 here:
      # a full backlog can drop a connection the client saw complete, and the
      # application's side of each connection is what charges it. The backlog
      # row floods a listener of backlog 1 that accepts nothing and checks
      # that every connect the client completed is accepted or reset at the
      # client, never left open with no one to accept it. The canary rows
      # check that the count is proved before the proxy says it is ready, or
      # unknown from the start. Only these rows of ./pkg/agent/proxy run here
      # (see the first test step for why).
      - name: Test the proxy's accept count (amd64)
        run: go test -count=1 -run "TestOnWindowsAFullBacklogResetsAConnectionItDropsAfterTheClientCompletedIt|TestWithAShimsCount" ./pkg/agent/proxy/
        shell: cmd

      # The resolvers a recording asks on Windows: the DNS servers of the
      # adapters that are up, read with GetAdaptersAddresses and checked
      # against PowerShell's list, and a name only they answer (a private
      # address's PTR) recorded with their answer rather than a public
      # resolver's. A name one adapter's server denies is asked on the next
      # adapter, as Windows asks it, and a server's failure (SERVFAIL) on the
      # next server: the row adds an adapter of its own (an internal Hyper-V
      # switch's; it skips and says why where Hyper-V is not running), gives
      # only it two DNS servers, compares the recording with Resolve-DnsName
      # and removes the adapter. The machine's own adapters are not changed.
      - name: Test the machine's DNS resolvers (amd64)
        run: go test -count=1 -v -run "TestOnWindowsARecordingAsksEachAdapterAsWindowsDoes|TestOnWindowsTheRecordingAsksTheMachinesResolvers|TestOnWindowsTheAdaptersAreReadWhateverTheFirstBufferSize|TestOnWindowsAFailedAdapterReadIsAnError|TestOnWindowsEachAdapterAndServerOfTheListIsRead" ./pkg/agent/proxy/
        shell: cmd

      # The native agent's watch of the keploy client that started it
      # (cli/watch_parent_windows.go): the agent command runs with
      # --client-pid naming a stand-in client and must end once that client
      # is killed, and not before; a reused pid, a pid no process has, a
      # client it may not open and a failed wait are each handled as the
      # rows say. Only these rows of ./cli run here: on Windows the package's
      # config tests fail on a file mode and one waits on a prompt.
      - name: Test the agent's watch of its client (amd64)
        run: go test -count=1 -v -run "TestAnAgentEndsWhenTheClientThatStartedItIsKilled|TestOnWindows" ./cli/
        shell: cmd

      # keploy's CA trust on Windows, the rows that need no standard user:
      # the reads of the user's and the machine's ROOT stores (each store's
      # first and last certificate is found, a fresh one is not), certutil's
      # exit for a session that cannot show the trust prompt, and the check
      # that alone lets a run change the machine's trust. This runner's user
      # is an administrator (KEPLOY_ROW_TOKEN_ELEVATED=1): that check must
      # say so, and must say no on a thread impersonating the same token
      # restricted to Administrators deny-only, which still reports
      # TokenElevation. The rows that run as a standard user with no desktop
      # need a second account: they run where one exists, with
      # KEPLOY_ROW_NO_DESKTOP_STANDARD_USER=1.
      # Only these rows of ./pkg/agent/proxy/tls/ run here (see the first test
      # step for why).
      - name: Test keploy's CA trust (amd64)
        run: go test -count=1 -v -run "TestOnWindowsTheRootStoresAreReadForTheCAsTheyHold|TestOnWindowsCertutilsNotSupportedExitIsANoTrustPrompt|TestOnWindowsTokenElevatedReadsTheRunsToken|TestOnWindowsATokenWithAdministratorsDenyOnlyIsNotElevated" ./pkg/agent/proxy/tls/
        shell: cmd
        env:
          KEPLOY_ROW_TOKEN_ELEVATED: "1"
