name: Go on Windows

on:
  pull_request:
    branches: [ main ]

jobs:

  build:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build amd64
        run: |
          set GOARCH=amd64
          go build -v ./...
        shell: cmd

      - name: Build arm64
        run: |
          set GOARCH=arm64
          go build -v ./...
        shell: cmd

      # The unprivileged (no-Administrator) interception backend can only be
      # exercised on a real Windows machine: it injects a DLL into a live
      # process, hooks Winsock in user space and talks to the agent over a named
      # pipe. These tests drive the production code end to end — they stage the
      # real shim, inject it into a process started through `cmd /C` exactly as
      # keploy does, and assert both that an outgoing connection reaches the
      # proxy with its original destination recoverable from the source port and
      # that a server bind is moved so keploy can own the advertised port.
      - name: Test the unprivileged Windows interception backend
        run: |
          set GOARCH=amd64
          go test -v -count=1 -timeout 10m ./pkg/agent/hooks/winshim/...
        shell: cmd