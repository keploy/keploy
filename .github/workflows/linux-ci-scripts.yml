name: Linux CI scripts

# Every Linux lane installs its apt packages through
# test_workflow_scripts/apt-install.sh, so a mistake there fails lanes that
# have nothing to do with the change. Its mirror failover only matters when a
# mirror is failing or slow, and its Ubuntu-only update only when a third-party
# index is broken, which an ordinary run never shows. The tests make all three
# happen on purpose, against a stub mirror. They run on every change to the
# helper or its tests.
#
# Also here: free-port.sh, the port the compose lanes publish their app on,
# whose window keeps clear of the port Docker's DNS server holds in every
# container on a user-defined network. Its tests check that on Docker itself.
#
# And compose-proven-setend-linux.tests.sh: the lane "proven set-end stop
# (docker_compose)"'s record() and await() against a fake keploy. A recording
# that lacks a test case, as a failed request or keploy dropping one leaves it,
# has to end with its log printed, not hold the lane until its job is
# cancelled; and one that has them all has to pass, its test cases written as
# the requests are answered or as keploy record stops. await() has to wait for
# a log keploy makes after it begins, and fail once keploy exits with none.
#
# And keploy-installer.tests.sh: keploy.sh, served as https://keploy.io/install.sh,
# on its default route (the hand-off to https://keploy.io/ent/install.sh) and
# its --oss route, sourced under bash and zsh against a curl stub. Run from a
# repo root that has its own install.sh, it must leave the caller's directory
# alone: download into a temp directory of its own, never over ./install.sh,
# never source a local install.sh in place of a failed download, and delete
# nothing there. With --oss it must download and extract in a temp directory
# of its own too, and touch no fixed /tmp path, nor anyone else's files.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test_workflow_scripts/apt-install.sh'
      - '.github/workflows/test_workflow_scripts/apt-install.tests.sh'
      - '.github/workflows/test_workflow_scripts/free-port.sh'
      - '.github/workflows/test_workflow_scripts/free-port.tests.sh'
      - '.github/workflows/test_workflow_scripts/compose-proven-setend-linux.sh'
      - '.github/workflows/test_workflow_scripts/compose-proven-setend-linux.tests.sh'
      - 'keploy.sh'
      - '.github/workflows/test_workflow_scripts/keploy-installer.tests.sh'
      - '.github/workflows/linux-ci-scripts.yml'
  pull_request:
    paths:
      - '.github/workflows/test_workflow_scripts/apt-install.sh'
      - '.github/workflows/test_workflow_scripts/apt-install.tests.sh'
      - '.github/workflows/test_workflow_scripts/free-port.sh'
      - '.github/workflows/test_workflow_scripts/free-port.tests.sh'
      - '.github/workflows/test_workflow_scripts/compose-proven-setend-linux.sh'
      - '.github/workflows/test_workflow_scripts/compose-proven-setend-linux.tests.sh'
      - 'keploy.sh'
      - '.github/workflows/test_workflow_scripts/keploy-installer.tests.sh'
      - '.github/workflows/linux-ci-scripts.yml'

permissions:
  contents: read

jobs:
  apt-install:
    # Eleven ubuntu containers that fetch the package lists once or more each
    # (through the stub, which asks the real mirror for each list only the
    # first time), one that builds the test repository, and two with no
    # network. About seven minutes of a run are waits the cases are made of:
    # against the stub, the 45 s limits of two controls, seven slices of 20 s
    # and two budgets of 90 s; in each of the two offline containers, under a
    # minute of slices and budgets of 1 to 8 s. The fetching and installing
    # comes on top, and how long that takes on a runner is in the job's own
    # history, not here.
    #
    # Each networked case is capped at 300 s and prints its log as soon as it
    # has failed. Eleven of them at the cap are 55 minutes, so this limit lets
    # a run in which every one of them hangs end by itself, with every log.
    timeout-minutes: 65
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test apt-install.sh (mirror failover, slow mirrors, third-party sources, source rewrite)
        run: bash .github/workflows/test_workflow_scripts/apt-install.tests.sh

  # The shape the Ubuntu-only update is for, on the real thing: GitHub's own
  # image, as the runner user through sudo, beside the image's
  # packages.microsoft.com source. The update must not read that source, and
  # must not delete the lists of the sources it does not read. The image
  # already has a mirror list of its own, so no file under /etc/apt may
  # change.
  apt-install-on-runner:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a package through apt-install.sh on this runner
        run: |
          set -o pipefail
          # apt's own view of the enabled sources, read offline. Captured
          # first: under pipefail, `grep -q` quitting early could fail apt
          # with SIGPIPE.
          uris="$(sudo apt-get update --print-uris)"
          if ! grep -q 'packages\.microsoft\.com' <<<"$uris"; then
            echo "::error::this image has no enabled packages.microsoft.com source any more, so this job proves nothing; point it at a third-party source the image does have"
            exit 1
          fi
          # A list that belongs to no source the Ubuntu-only update reads.
          sentinel=/var/lib/apt/lists/packages.microsoft.com_sentinel_Packages
          sudo touch "$sentinel"
          snap() { sudo find /etc/apt -type f -exec sha256sum {} + | sort; }
          snap >"$RUNNER_TEMP/etc-apt.before"
          bash .github/workflows/test_workflow_scripts/apt-install.sh hello 2>&1 | tee "$RUNNER_TEMP/apt.log"
          hello
          snap >"$RUNNER_TEMP/etc-apt.after"
          if ! diff "$RUNNER_TEMP/etc-apt.before" "$RUNNER_TEMP/etc-apt.after"; then
            echo "::error::apt-install.sh changed /etc/apt (above) on an image that already has a mirror list"
            exit 1
          fi
          # Without the update's per-item lines the check below would pass on
          # nothing.
          if ! grep -qE '^(Get|Hit):[0-9]+ .* InRelease' "$RUNNER_TEMP/apt.log"; then
            echo "::error::no Get:/Hit: line for an InRelease in the apt output; has its format changed?"
            exit 1
          fi
          if grep -E '^(Get|Hit|Ign|Err):[0-9]+ .*packages\.microsoft\.com' "$RUNNER_TEMP/apt.log"; then
            echo "::error::the Ubuntu-only update read packages.microsoft.com"
            exit 1
          fi
          # apt skips its list cleanup after a failed fetch, and says this.
          if grep -q 'Some index files failed to download' "$RUNNER_TEMP/apt.log"; then
            grep -E '^(W|E): ' "$RUNNER_TEMP/apt.log" || true
            echo "::error::an index fetch failed on every mirror (above), so apt skipped its list cleanup and the sentinel check cannot conclude"
            exit 1
          fi
          if [ ! -f "$sentinel" ]; then
            echo "::error::the Ubuntu-only update deleted the lists of the sources it did not read"
            exit 1
          fi
          # The control: on this image an update with cleanup on does delete
          # the sentinel. It reads no source, and empties the lists.
          sudo apt-get -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts=/dev/null update
          if [ -f "$sentinel" ]; then
            echo "::error::apt's list cleanup kept the sentinel, so the check above proves nothing"
            exit 1
          fi

  # Docker's DNS server listens in each container on a user-defined network
  # on a port of the ephemeral range, so an app given a port the kernel picked
  # could not bind it there (job 124142018005). The tests start one such
  # container: its pull and start are most of a run.
  free-port:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test free-port.sh (its window and order, busy and skipped ports, host ranges, Docker's DNS port)
        run: bash .github/workflows/test_workflow_scripts/free-port.tests.sh

  compose-proven-setend:
    # Six cases (four of record(), two of await()), a few seconds; each
    # bounds the hang it tests for at 60 s, so all six hanging take 6 min,
    # and the logs the script prints at its end still show.
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test compose-proven-setend-linux.sh (a recording's test cases counted once keploy record has stopped; await on a log made late or never)
        run: bash .github/workflows/test_workflow_scripts/compose-proven-setend-linux.tests.sh

  installer:
    # Seventeen cases, under bash and under zsh; a few seconds. The one on a
    # terminal (script(1), in bsdutils on ubuntu) bounds itself at 120 s per
    # shell, so both hanging still leave the log time to show.
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh, which macOS users source the installer from
        run: bash .github/workflows/test_workflow_scripts/apt-install.sh zsh

      - name: Test keploy.sh (leaves the caller's directory alone; downloads into a temp directory of its own)
        env:
          REQUIRE_ZSH: '1'
          REQUIRE_PTY: '1'
        run: bash .github/workflows/test_workflow_scripts/keploy-installer.tests.sh
