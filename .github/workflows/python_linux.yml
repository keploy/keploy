name: Python On Linux
on:
  workflow_call:
    inputs:
      runner:
        description: 'The type of runner to use for this job'
        type: string
        required: false
        default: 'ubuntu-latest'
      jobs_to_run:
        description: 'Controls which jobs to run. "all" runs everything.'
        type: string
        required: false
        default: 'all'
jobs:
  python_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: flask-secret
            path: flask-secret
            script_dir: flask-secret
        config:
          - job: record_latest_replay_build
            record_src: latest
            replay_src: build
          - job: record_build_replay_latest
            record_src: build
            replay_src: latest
          - job: record_build_replay_build
            record_src: build
            replay_src: build
    name: ${{ matrix.app.name }} (${{ matrix.config.job }})
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Checkout the samples-python repository
        uses: actions/checkout@v4
        with:
          repository: keploy/samples-python
          path: samples-python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: samples-python/${{ matrix.app.path }}/requirements.txt

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: ${{ matrix.config.record_src }}

      - id: replay
        uses: ./.github/actions/download-binary
        with:
          src: ${{ matrix.config.replay_src }}
      - name: Run the ${{ matrix.app.name }} application
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.replay.outputs.path }}
        run: |
          cd samples-python/${{ matrix.app.path }}
          source $GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/${{ matrix.app.script_dir }}/python-linux.sh

      # keploy's log and its agent's boot.json, which keploy removes when it
      # exits: the lane copies them here when it gives up on keploy's start or
      # the app's (keploy-start-wait.sh).
      - name: Upload keploy's logs and start reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-${{ matrix.config.job }}-keploy-start
          path: samples-python/${{ matrix.app.path }}/keploy-start-evidence/
          if-no-files-found: ignore
          retention-days: 7

      # TODO(postgres-v3 RCA): flask-secret is not postgres-touching, so
      # KEPLOY_PG_V3_LOG_BIND_VALUES + recordings upload are intentionally
      # skipped here. See django-postgres job below for the instrumented
      # template; mirror it here only if flask-secret regresses on PG.

  # An app on mysqlclient built on MariaDB Connector/C (Frappe's default
  # driver), against MariaDB and MySQL: every exchange is recorded (a JSON
  # column's extended type info and the metadata-follows byte are framed) and
  # every handshake is served on replay (the greeting carries MariaDB's
  # extended capabilities). The app is in this repo
  # (test_workflow_scripts/python/mysqlclient_mariadb). Record and replay with
  # the build only: a released keploy before this check is the bug.
  mysqlclient_mariadb:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.6', 'mysql:8.0']
    name: mysqlclient on ${{ matrix.db }} (record_build_replay_build)
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mysqlclient on MariaDB Connector/C
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/apt-install.sh" build-essential pkg-config libmariadb-dev
          # mysqlclient ships no Linux wheel: it builds against the client
          # library these flags name, MariaDB's and not libmysqlclient.
          MYSQLCLIENT_CFLAGS="$(pkg-config --cflags libmariadb)" MYSQLCLIENT_LDFLAGS="$(pkg-config --libs libmariadb)" \
            python3 -m pip install --no-cache-dir mysqlclient
          python3 -c 'import MySQLdb, sys; v = MySQLdb.get_client_info(); print("client library", v); sys.exit(0 if v.startswith("3.") else 1)' ||
            { echo "::error::mysqlclient is not built on MariaDB Connector/C (3.x)"; exit 1; }

      - id: build
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Record and replay
        env:
          RECORD_BIN: ${{ steps.build.outputs.path }}
          REPLAY_BIN: ${{ steps.build.outputs.path }}
          DB_IMAGE: ${{ matrix.db }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/mysqlclient_mariadb/python-linux.sh"

  python_linux_private:
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: django-postgres
            path: django-postgres/django_postgres
            script_dir: django_postgres
        config:
          - job: record_latest_replay_build
            record_src: latest
            replay_src: build
          - job: record_build_replay_latest
            record_src: build
            replay_src: latest
          - job: record_build_replay_build
            record_src: build
            replay_src: build
    name: ${{ matrix.app.name }} (${{ matrix.config.job }})
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Checkout the samples-python repository
        uses: actions/checkout@v4
        with:
          repository: keploy/samples-python
          path: samples-python
          ref: native-linux

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: samples-python/${{ matrix.app.path }}/requirements.txt

      - name: Setup docker-compose
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          # --fail matters more than the retries: without it curl writes the
          # HTTP error body into the plugin file and exits 0, chmod +x happily
          # marks it executable, and the failure only surfaces later as
          # "docker: unknown command: docker compose". Observed on run
          # 32473729951, where this fetched 92 bytes instead of the binary.
          curl -fSL --retry 5 --retry-delay 2 --retry-connrefused \
            https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64 \
            -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          docker compose version

      - name: Install necessary dependencies
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/apt-install.sh" build-essential gcc python3-dev libpq-dev pkg-config

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: ${{ matrix.config.record_src }}

      - id: replay
        uses: ./.github/actions/download-binary
        with:
          src: ${{ matrix.config.replay_src }}
      - name: Run the ${{ matrix.app.name }} application
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.replay.outputs.path }}
          # RCA instrumentation for postgres-v3 per-test window misalignment
          # (see PR #4126). Logs live PG bind values on replay matcher misses
          # so the uploaded recordings can be cross-checked offline.
          KEPLOY_PG_V3_LOG_BIND_VALUES: "1"
        run: |
          cd samples-python/${{ matrix.app.path }}
          source $GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/${{ matrix.app.script_dir }}/python-linux.sh

      - name: Upload ${{ matrix.app.name }} recorded mocks and replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-${{ matrix.config.job }}-recordings
          path: |
            samples-python/${{ matrix.app.path }}/keploy/
            samples-python/${{ matrix.app.path }}/test_logs.txt
            samples-python/${{ matrix.app.path }}/*App_*.txt
            samples-python/${{ matrix.app.path }}/keploy-start-evidence/
          if-no-files-found: warn
          retention-days: 7
