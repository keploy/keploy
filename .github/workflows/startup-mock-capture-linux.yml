name: Startup Mock Capture Regression (Linux)
# Regression guard: a once-per-boot outbound call (e.g. an AWS Secret
# Manager fetch performed at application startup, before the app serves
# any inbound request) must be captured as a mock in EVERY recorded test
# set. The app fetches a secret at import time from a fake upstream; the
# guard records two test sets and asserts the startup mock landed in both.
#
# Runs only the `build` (PR) binary: in the pure-OSS record path the
# startup call is direct-sent to disk, so this guards the persistence
# path end-to-end rather than demonstrating the bug on `latest` (the
# deterministic trigger is the enterprise --static-dedup path). The
# precise regression lives in the Go unit tests under
# pkg/agent/proxy/syncMock.
#
# Also here, on the same runner and binary: two records started together on
# the default ports (python/concurrent-records). Each CLI hands its agent
# the configured ports unchecked, and an agent that finds its port taken
# moves off it, naming the holder, and tells its hooks. Each run's mocks must
# hold its own app's DNS names and upstream calls, and none of the other
# run's, and a proxy or DNS server off its configured port must be on one its
# agent said it moved to. With one run started once the other's agent
# listens, its agent must move both; with UDP 26789 held, both agents must
# move their DNS servers, naming its holder.
#
# Also here: worker-mock rules (python/worker-mock-rules). Two worker
# processes each make a read on their first request (a JWKS fetch; a MySQL
# schema read), which a rule in keploy.yml names; the recording must mark the
# reads in the set's worker scope, and every replay must serve them to
# whichever test reaches a cold worker.
on:
  workflow_call:
    inputs:
      runner:
        description: 'The type of runner to use for this job'
        type: string
        required: false
        default: 'ubuntu-latest'
      jobs_to_run:
        description: 'Controls which jobs to run. "all" runs everything.'
        type: string
        required: false
        default: 'all'

jobs:
  startup_mock_capture_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: startup-mock-capture (record_with_build)
    # The worker-mock rules step pulls mysql:8 and replays each of its two
    # legs up to twenty times (a control and the set, ten runs each at most,
    # some 35 s a run); both loops end at their first telling run.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run regression guard
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        # `bash <script>` (not `source`) so the script's intentional
        # `set +e` is not overridden by the step's default `-eo pipefail`.
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/startup-mock-capture/python-linux.sh"

      - name: Two records started together
        if: ${{ !cancelled() }}
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/concurrent-records/python-linux.sh"

      - name: Worker-mock rules served to every test
        if: ${{ !cancelled() }}
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/worker-mock-rules/python-linux.sh"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-mock-capture-logs
          path: |
            .github/workflows/test_workflow_scripts/python/startup-mock-capture/record_logs_0.txt
            .github/workflows/test_workflow_scripts/python/startup-mock-capture/record_logs_1.txt
            .github/workflows/test_workflow_scripts/python/startup-mock-capture/upstream_logs.txt
            .github/workflows/test_workflow_scripts/python/startup-mock-capture/keploy/
            .github/workflows/test_workflow_scripts/python/concurrent-records/record_logs_*.txt
            .github/workflows/test_workflow_scripts/python/concurrent-records/A/keploy/
            .github/workflows/test_workflow_scripts/python/concurrent-records/B/keploy/
            .github/workflows/test_workflow_scripts/python/worker-mock-rules/*_logs*.txt
            .github/workflows/test_workflow_scripts/python/worker-mock-rules/jwks/keploy/
            .github/workflows/test_workflow_scripts/python/worker-mock-rules/mysql/keploy/
            .github/workflows/test_workflow_scripts/python/worker-mock-rules/jwks-control/keploy/
            .github/workflows/test_workflow_scripts/python/worker-mock-rules/mysql-control/keploy/
          if-no-files-found: warn
          retention-days: 7
