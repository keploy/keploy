name: Interim Responses Record (Linux)
# Guard: an interim (1xx) response the app sends before its answer (a 103
# Early Hints, a 102 Processing, the 100 Continue to "Expect: 100-continue")
# is forwarded to the client, and the test case records the final response.
# The ingress took the first response it read for the answer: it forwarded
# and recorded a 103 with no body, and held the 100 back until the body its
# client was waiting on it to send had come. An upload the app answers before
# it reads the body is recorded whole: after the app's 100 (the client, given
# it, sends the body), and with no 100, as Go's server answers (the client
# sends the body once it stops waiting for the 100).
#
# Runs only the `build` (PR) binary, like the other guards of a fix the
# published `latest` does not have (repeated-headers-linux.yml,
# startup-mock-capture-linux.yml): a `latest` recorder records the 103, and
# a leg recording with it fails by construction. The replayer is unchanged
# (net/http's client passes over interim responses).
on:
  workflow_call:
    inputs:
      runner:
        description: 'The type of runner to use for this job'
        type: string
        required: false
        default: 'ubuntu-latest'
      jobs_to_run:
        description: 'Controls which jobs to run. "all" runs everything.'
        type: string
        required: false
        default: 'all'

jobs:
  interim_responses_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: interim-responses (record_build_replay_build)
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run interim-responses guard
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.record.outputs.path }}
        # `bash <script>` (not `source`) so the script's intentional `set +e`
        # is not overridden by the step's default `-eo pipefail`.
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/python/interim-responses/python-linux.sh"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interim-responses-logs
          path: |
            .github/workflows/test_workflow_scripts/python/interim-responses/*.txt
            .github/workflows/test_workflow_scripts/python/interim-responses/keploy/
          if-no-files-found: warn
          retention-days: 7
