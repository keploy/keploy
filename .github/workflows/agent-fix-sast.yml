name: Agent fix SAST findings

on:
  push:
    branches:
      - agent/fix-sast-hardcoded-password-pprof

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sast-hardcoded-password-pprof
          fetch-depth: 0

      - name: Apply focused SAST fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ca = Path('pkg/agent/proxy/tls/ca.go')
          text = ca.read_text()
          old = '''\tpassword := []byte("changeit")
\tif err := ks.Store(f, password); err != nil {'''
          new = '''\t// The generated truststore contains only public CA certificates, so a
\t// password provides no confidentiality. Store it without a hardcoded
\t// credential and let Java load it with an empty truststore password.
\tif err := ks.Store(f, nil); err != nil {'''
          if old not in text:
              raise SystemExit('expected hardcoded JKS password block not found')
          ca.write_text(text.replace(old, new, 1))

          main = Path('main.go')
          text = main.read_text()
          text = text.replace('\t"net/http"\n', '', 1)
          text = text.replace('\n\t_ "net/http/pprof"\n', '\n', 1)
          block = '''\n\t// Start pprof HTTP server for live profiling if PPROF_PORT is set
\tif pprofPort := os.Getenv("PPROF_PORT"); pprofPort != "" {
\t\tgo func() {
\t\t\taddr := "localhost:" + pprofPort
\t\t\tlogger.Info("pprof server starting", zap.String("addr", addr))
\t\t\tif err := http.ListenAndServe(addr, nil); err != nil {
\t\t\t\tlogger.Error("pprof server failed; check that PPROF_PORT is a valid port and not already in use, or unset the env var to disable",
\t\t\t\t\tzap.String("port", pprofPort), zap.Error(err))
\t\t\t}
\t\t}()
\t}
'''
          if block not in text:
              raise SystemExit('expected HTTP pprof block not found')
          main.write_text(text.replace(block, '\n', 1))
          PY

          gofmt -w main.go pkg/agent/proxy/tls/ca.go

      - name: Validate focused packages
        run: |
          go test ./pkg/agent/proxy/tls ./...

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-fix-sast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go pkg/agent/proxy/tls/ca.go .github/workflows/agent-fix-sast.yml
          git commit -m "fix SAST password and pprof findings"
          git push origin HEAD:agent/fix-sast-hardcoded-password-pprof
