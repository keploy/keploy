name: golangci-lint
on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # Central ref for the keploy/integrations commit this workflow checks
  # out via setup-private-parsers. Mirrors the default in
  # prepare_and_run.yml + release.yml so all three workflows track the
  # same integrations ref. Prefer the repo-level `vars.INTEGRATION_REF`
  # when set (so operators can override without editing this file),
  # falling back to `main`. Pin to a specific SHA via the repo var if
  # a feat branch needs to carry a cross-repo change.
  INTEGRATION_REF: d7ed82e78b27ecb7012101e5b71087a97b22fdea

jobs:
  golangci:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check for direct import of keploy/integrations
        run: |
          if grep -q "keploy/integrations" go.mod go.sum; then
            echo "🚨 keploy/integrations found in manifest files:"
            grep -n "keploy/integrations" go.mod go.sum || true
            echo "Please remove keploy/integrations dependencies as they are not accessible to external contributors."
            exit 1
          fi    
      
      - name: Add Private Parsers
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Configure Git to use SSH
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # PINNED, not floating: the action resolves the newest release at
          # run time, so a single upstream publish can turn every PR in this
          # repo red (that is exactly what v2.13.0 did — see below). A pin
          # means an upstream release can no longer break CI without someone
          # choosing it.
          #
          # This pin is coupled to the Go toolchain in go.mod and cannot lag
          # behind it. Each release here bundles a fixed honnef.co/go/tools
          # (staticcheck), whose IR builder must understand the stdlib of the
          # Go version it analyzes:
          #   v2.12.2  -> honnef v0.7.0      crashes on Go 1.27: "buildir:
          #               package "poll" ... unexpected expr: *ast.KeyValueExpr"
          #               (reproduced locally on go1.27.0).
          #   v2.13.0  -> honnef v0.8.0-rc.1 nilness panics with "internal
          #               error: unhandled builtin recover" on Go 1.26.
          #   v2.13.1  -> honnef v0.8.0      clean on go1.27.0 (verified
          #               locally: `golangci-lint run` reports 0 issues).
          version: v2.13.1
          only-new-issues: true
          args: --timeout=5m

      - name: Check gofmt (diff with line numbers)
        run: |
          output=$(gofmt -l -d .)
          if [ -n "$output" ]; then
            echo "🚨 gofmt found issues:"
            echo "$output"
            exit 1
          fi

      - name: Check for Deprecated Dependencies
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GOPRIVATE: github.com/keploy/*
        run: |
          source ./.github/workflows/test_workflow_scripts/check-deprecated-deps.sh