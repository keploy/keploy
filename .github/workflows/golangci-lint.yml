name: golangci-lint
on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # Central ref for the keploy/integrations commit this workflow checks
  # out via setup-private-parsers. Mirrors the default in
  # prepare_and_run.yml + release.yml so all three workflows track the
  # same integrations ref. Prefer the repo-level `vars.INTEGRATION_REF`
  # when set (so operators can override without editing this file),
  # falling back to `main`. Pin to a specific SHA via the repo var if
  # a feat branch needs to carry a cross-repo change.
  INTEGRATION_REF: 2945fbebf686a3ea92bf8e076f0753bb17a6535e

jobs:
  golangci:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: lint
    runs-on: ubuntu-latest
    steps:
      # The whole history: the lint step finds the lines this event changed
      # with git (golangci-new-from.sh), not with GitHub's diff API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No lane pulls from ECR Public, whose anonymous quota is per source IP
      # and GitHub's runners share theirs (the script says how). First, so a
      # lint failure does not hide it; it needs no Go.
      - name: Check image registries
        run: bash ./.github/workflows/test_workflow_scripts/check-image-registries.sh

      # No workflow downloads an artifact with a download-artifact older than
      # v8: before v6 a download that stops part-way ends green with a
      # truncated file, and before v8 a digest mismatch is only a warning (the
      # script says how). It needs no Go either.
      - name: Check artifact downloads
        run: bash ./.github/workflows/test_workflow_scripts/check-artifact-downloads.sh

      # The flag that limits the lint step to issues on the lines this event
      # adds or changes, from the checkout's history (the script says why).
      # It needs no Go, so a checkout it cannot read fails here in seconds.
      # Its cases first: they fetch a repository of their own over file://.
      - name: Test finding the lines an event changed
        run: bash ./.github/workflows/test_workflow_scripts/golangci-new-from.tests.sh

      - name: Find the lines this event changed
        id: newfrom
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash ./.github/workflows/test_workflow_scripts/golangci-new-from.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check for direct import of keploy/integrations
        run: |
          if grep -q "keploy/integrations" go.mod go.sum; then
            echo "🚨 keploy/integrations found in manifest files:"
            grep -n "keploy/integrations" go.mod go.sum || true
            echo "Please remove keploy/integrations dependencies as they are not accessible to external contributors."
            exit 1
          fi    
      
      - name: Add Private Parsers
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Configure Git to use SSH
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # PINNED, not floating: the action resolves the newest release at
          # run time, so a single upstream publish can turn every PR in this
          # repo red (that is exactly what v2.13.0 did — see below). A pin
          # means an upstream release can no longer break CI without someone
          # choosing it.
          #
          # This pin is coupled to the Go toolchain in go.mod and cannot lag
          # behind it. Each release here bundles a fixed honnef.co/go/tools
          # (staticcheck), whose IR builder must understand the stdlib of the
          # Go version it analyzes:
          #   v2.12.2  -> honnef v0.7.0      crashes on Go 1.27: "buildir:
          #               package "poll" ... unexpected expr: *ast.KeyValueExpr"
          #               (reproduced locally on go1.27.0).
          #   v2.13.0  -> honnef v0.8.0-rc.1 nilness panics with "internal
          #               error: unhandled builtin recover" on Go 1.26.
          #   v2.13.1  -> honnef v0.8.0      clean on go1.27.0 (verified
          #               locally: `golangci-lint run` reports 0 issues).
          #   v2.13.x  fails on go1.27.2+: "export data version 5 is greater
          #               than maximum supported version 4" for every stdlib
          #               import, so lint type-checks nothing.
          #   v2.14.0  -> first release that reads go1.27.2+ export data; 0
          #               issues on go1.27.3 (go.mod's go line, the eMudhra
          #               crypto/x509 fix). Same version keploy-ci-golint ships.
          version: v2.14.0
          # Never the action's only-new-issues: it fetches the diff from
          # GitHub's API, which refuses a PR diff over 20,000 lines (406),
          # and on that, or on any API error for a push, the action lints the
          # whole repository instead (over a thousand issues no PR added).
          # The flag from the step above has golangci-lint diff the checkout
          # with git: an issue on a line this event adds or changes fails.
          only-new-issues: false
          args: --timeout=5m ${{ steps.newfrom.outputs.flag }}

      - name: Check gofmt (diff with line numbers)
        run: |
          output=$(gofmt -l -d .)
          if [ -n "$output" ]; then
            echo "🚨 gofmt found issues:"
            echo "$output"
            exit 1
          fi

      - name: Check for Deprecated Dependencies
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GOPRIVATE: github.com/keploy/*
        run: |
          source ./.github/workflows/test_workflow_scripts/check-deprecated-deps.sh