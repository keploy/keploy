name: golangci-lint
on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # Central ref for the keploy/integrations commit this workflow checks
  # out via setup-private-parsers. Mirrors the default in
  # prepare_and_run.yml + release.yml so all three workflows track the
  # same integrations ref. Prefer the repo-level `vars.INTEGRATION_REF`
  # when set (so operators can override without editing this file),
  # falling back to `main`. Pin to a specific SHA via the repo var if
  # a feat branch needs to carry a cross-repo change.
  INTEGRATION_REF: ${{ vars.INTEGRATION_REF || 'main' }}

jobs:
  # A few Windows workflow steps must run BEFORE actions/checkout (they are
  # what repairs the workspace so checkout can succeed), so they cannot call a
  # script out of the repository - it is not on disk yet. They inline the body
  # of .github/scripts/windows/recover-stale-workspace.ps1 instead, so the same
  # body exists at five call sites as well as in the script they are copied
  # from, and the copies can drift apart. Drift between them is the bug this
  # arrangement exists to prevent, so it is checked mechanically here instead
  # of being left to a comment asking people to keep the copies in sync.
  #
  # It lives in the lint workflow because that workflow runs on every pull
  # request with no path or branch filter and already hosts the repo's non-Go
  # static checks (the keploy/integrations import check, gofmt, the
  # deprecated-dependency scan), so a "these files must stay identical" check
  # belongs with them rather than in a workflow of its own. It is a separate
  # job so it neither waits on the Go toolchain nor hides inside the
  # golangci-lint report.
  inline-regions:
    name: inline-regions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check inlined script regions match their source
        run: python3 .github/scripts/check-inline-regions.py

  golangci:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check for direct import of keploy/integrations
        run: |
          if grep -q "keploy/integrations" go.mod go.sum; then
            echo "🚨 keploy/integrations found in manifest files:"
            grep -n "keploy/integrations" go.mod go.sum || true
            echo "Please remove keploy/integrations dependencies as they are not accessible to external contributors."
            exit 1
          fi    
      
      - name: Add Private Parsers
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Configure Git to use SSH
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # PINNED, not floating. golangci-lint v2.13.0 (released 2026-08-19,
          # 23:29 UTC) bundles honnef.co/go/tools v0.8.0-rc.1, whose nilness
          # analyzer panics with "internal error: unhandled builtin recover" on
          # Go 1.26 — reproduced locally against the sentry dependency. Because
          # the action resolves the newest release at run time, that single
          # upstream publish turned every PR in this repo red within hours,
          # including PRs containing no Go code at all. A pin means an upstream
          # release can no longer break CI without someone choosing it.
          version: v2.12.2
          only-new-issues: true
          args: --timeout=5m

      - name: Check gofmt (diff with line numbers)
        run: |
          output=$(gofmt -l -d .)
          if [ -n "$output" ]; then
            echo "🚨 gofmt found issues:"
            echo "$output"
            exit 1
          fi

      - name: Check for Deprecated Dependencies
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GOPRIVATE: github.com/keploy/*
        run: |
          source ./.github/workflows/test_workflow_scripts/check-deprecated-deps.sh