name: Keploy Performance Test

on:
  workflow_dispatch:
    inputs:
      keploy_repo:
        description: 'Keploy repository for performance testing'
        required: false
        default: 'keploy/keploy'
      keploy_branch:
        description: 'Keploy branch for performance testing'
        required: false
        default: 'main'
  pull_request:
    branches: [ main ]
  # A cache a pull_request run saves is scoped to that PR's merge ref and no
  # other PR can restore it; only a cache saved on the default branch is
  # shared. Running on main is what seeds the PetClinic jar and k6 caches
  # below for every PR, and also gives a post-merge performance signal.
  push:
    branches: [ main ]

concurrency:
  # One group per PR, per pushed commit and per manual run's ref, and only a
  # PR's newer push cancels its older run: a merge never cancels a manual run
  # or the previous merge's post-merge signal.
  group: keploy-performance-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The app under load: a spring-petclinic commit and the JDK its jar is
      # built and run with (Checkout Spring PetClinic says how to move them).
      PETCLINIC_REF: 818c4136ea971c21674525f9053de0d9c7ad8cfe
      PETCLINIC_JAVA: '17'
      # The k6 release the load is made with (Install k6 says how to move it).
      PERF_K6_VERSION: '2.4.0'
      PERF_K6_SHA256: 5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: petclinic
          MYSQL_DATABASE: petclinic
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppetclinic" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Keploy (current branch with scripts)
        uses: actions/checkout@v4
        with:
          path: keploy

      - name: Checkout Keploy to test (custom repo/branch if manually specified)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.keploy_repo || 'keploy/keploy' }}
          ref: ${{ github.event.inputs.keploy_branch || 'main' }}
          path: keploy-to-test

      - name: Checkout Spring PetClinic
        uses: actions/checkout@v4
        with:
          repository: spring-projects/spring-petclinic
          # Pinned: the fixture app, its dependency set and the Maven version
          # its wrapper downloads must not change under this job when upstream
          # main moves; the latency thresholds below are baselines of this
          # exact app. To move it, set
          # PETCLINIC_REF to the full SHA of another spring-petclinic commit,
          # in a PR of its own. Its jar's cache key changes with it (Restore
          # the PetClinic jar): the PR's run builds the new jar once, and so
          # does the first run on main after the merge, for every later run.
          # Before merging, check the numbers the PR's run posts against the
          # thresholds below.
          ref: ${{ env.PETCLINIC_REF }}
          path: petclinic

      # The JDK build jdks.txt pins for PETCLINIC_JAVA: the runner image's own
      # copy of exactly that build, else its checked and cached archive (the
      # action says how), like k6 below.
      - name: Setup Java ${{ env.PETCLINIC_JAVA }}
        uses: ./keploy/.github/actions/setup-java-maven/jdk
        with:
          java-version: ${{ env.PETCLINIC_JAVA }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # No go-version here on purpose: actions/setup-go uses go-version and
          # IGNORES go-version-file when both are set (docs/advanced-usage.md:
          # "If both the go-version and the go-version-file inputs are provided
          # then the go-version input is used"). A hardcoded version would
          # therefore silently defeat the repo-aware selection below AND, since
          # setup-go exports GOTOOLCHAIN=local, pin the job to a toolchain that
          # cannot build a go.mod requiring a newer Go.
          go-version-file: ${{ github.event_name == 'workflow_dispatch' && 'keploy-to-test/go.mod' || 'keploy/go.mod' }}
          cache: true
          cache-dependency-path: |
            keploy/go.sum
            keploy-to-test/go.sum

      # k6 makes the load the thresholds below are measured under, so its
      # version is pinned like PetClinic's commit: unpinned, this job moved
      # from k6 2.3.0 to 2.4.0 the day 2.4.0 came out. Its release archive is
      # checked against the sha256 the release publishes on every run, and
      # kept in the cache under that digest, so a run downloads it only when
      # the cache has no copy: downloaded from GitHub's release servers on
      # every run, it failed two of main's runs on 2026-11-08 (HTTP 504).
      # To move k6, set PERF_K6_VERSION and PERF_K6_SHA256 (the
      # linux-amd64.tar.gz line of the release's k6-v<version>-checksums.txt).
      - name: Restore k6
        id: k6-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/perf-k6
          key: perf-k6-${{ env.PERF_K6_VERSION }}-linux-amd64-${{ env.PERF_K6_SHA256 }}

      - name: Install k6
        run: ./keploy/.github/workflows/test_workflow_scripts/performance/install-k6.sh

      - name: Save k6
        if: steps.k6-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/perf-k6
          key: ${{ steps.k6-cache.outputs.cache-primary-key }}

      # The jar under load is built once per PetClinic commit, JDK and build
      # script, and every other run takes it from the cache and runs no Maven
      # at all. Built on every run from a restored ~/.m2, ./mvnw asked Maven
      # Central for the metadata of the version ranges PetClinic's plugins
      # name (BouncyCastle's, through git-commit-id-maven-plugin) once the
      # restored copy was a day old, which, as an entry is never replaced,
      # was every run; Central's 404 for one of them failed the build on
      # 2026-11-19. An offline build asks nothing, but Maven skips the goals
      # that require online mode, CycloneDX's makeAggregateBom among them, so
      # its jar has no SBOM. Repeat builds of this step on one machine make
      # byte-identical jars.
      - name: Restore the PetClinic jar
        id: petclinic-jar
        uses: actions/cache/restore@v4
        with:
          path: petclinic/target/spring-petclinic-*.jar
          key: petclinic-jar-${{ runner.os }}-java${{ env.PETCLINIC_JAVA }}-${{ env.PETCLINIC_REF }}-${{ hashFiles('keploy/.github/workflows/test_workflow_scripts/performance/build-petclinic.sh') }}

      - name: Build Spring PetClinic
        if: steps.petclinic-jar.outputs.cache-hit != 'true'
        working-directory: petclinic
        run: ../keploy/.github/workflows/test_workflow_scripts/performance/build-petclinic.sh

      # Saved as soon as the build succeeds rather than in a post step, which
      # only saves when the whole job passes: a later performance failure must
      # not keep the cache from being seeded.
      - name: Save the PetClinic jar
        if: steps.petclinic-jar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: petclinic/target/spring-petclinic-*.jar
          key: ${{ steps.petclinic-jar.outputs.cache-primary-key }}

      - name: Build Keploy
        run: |
          # Determine which directory to build from
          if [ -d "keploy-to-test" ]; then
            BUILD_DIR="keploy-to-test"
            echo "Building from custom repo/branch: keploy-to-test/"
          else
            BUILD_DIR="keploy"
            echo "Building from current branch: keploy/"
          fi

          cd "$BUILD_DIR"
          go build -o keploy main.go

          # Move binary to keploy directory if built elsewhere
          if [ "$BUILD_DIR" != "keploy" ]; then
            cp keploy ../keploy/keploy
          fi
          
      - name: Verify Keploy binary
        working-directory: keploy
        run: |
          chmod +x keploy
          echo "Keploy binary info:"
          ls -lh keploy
          ./keploy --version || echo "Version check failed (might be expected)"

      - name: Start PetClinic with Keploy recording
        working-directory: keploy
        run: ./.github/workflows/test_workflow_scripts/performance/start-petclinic-with-keploy.sh

      - name: Create k6 load test script
        working-directory: keploy
        run: ./.github/workflows/test_workflow_scripts/performance/create-k6-script.sh

      - name: Run k6 performance tests (3 runs with validation)
        working-directory: keploy
        run: ./.github/workflows/test_workflow_scripts/performance/run-perf-test-with-validation.sh
        env:
          NUM_RUNS: 3
          REQUIRED_FAILURES: 2
          P50_THRESHOLD: 5       # Based on baseline ~2.5ms
          P90_THRESHOLD: 15      # Based on baseline ~7.6ms
          P99_THRESHOLD: 70      # Based on baseline ~15-60ms (increased for CI variance)
          RPS_THRESHOLD: 100     # Target 100 RPS (allows 1% tolerance = 99 RPS)

      - name: Stop Keploy
        if: always()
        working-directory: keploy
        run: ./.github/workflows/test_workflow_scripts/performance/stop-keploy.sh

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: keploy/perf-results/
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest results directory
            const resultsDir = 'keploy/perf-results';
            if (!fs.existsSync(resultsDir)) {
              console.log('No results directory found');
              return;
            }
            
            const dirs = fs.readdirSync(resultsDir);
            if (dirs.length === 0) {
              console.log('No results found');
              return;
            }
            
            const latestDir = dirs.sort().reverse()[0];
            const resultsPath = path.join(resultsDir, latestDir);
            
            // Sort files by run number to ensure correct ordering
            const getRunNumber = (filename) => {
              const match = filename.match(/run-(\d+)-output\.log$/);
              return match ? parseInt(match[1], 10) : Number.MAX_SAFE_INTEGER;
            };
            
            const files = fs.readdirSync(resultsPath)
              .filter(f => f.endsWith('-output.log'))
              .sort((a, b) => {
                const aNum = getRunNumber(a);
                const bNum = getRunNumber(b);
                if (aNum !== bNum) return aNum - bNum;
                return a.localeCompare(b);
              });
            
            let comment = '## 🚀 Keploy Performance Test Results\n\n';
            comment += '**Multi-Run Validation:** Tests run 3 times, pipeline fails only if 2+ runs show regression.\n\n';
            comment += '| Run | P50 | P90 | P99 | RPS | Error Rate | Status |\n';
            comment += '|-----|-----|-----|-----|-----|------------|--------|\n';
            
            let passCount = 0;
            let failCount = 0;
            
            files.forEach((file, idx) => {
              const content = fs.readFileSync(path.join(resultsPath, file), 'utf8');
              
              // Extract metrics
              const p50Match = content.match(/med=([0-9.]+[µm]?s)/);
              const p90Match = content.match(/p\(90\)=([0-9.]+[µm]?s)/);
              const p99Match = content.match(/p\(99\)=([0-9.]+[µm]?s)/);
              const errorMatch = content.match(/http_req_failed.*?(?:rate=([0-9.]+)|:\s*([0-9.]+)%)/);
              const rpsMatch = content.match(/http_reqs.*:\s+\d+\s+([0-9.]+)\/s/);
              
              const p50 = p50Match ? p50Match[1] : 'N/A';
              const p90 = p90Match ? p90Match[1] : 'N/A';
              const p99 = p99Match ? p99Match[1] : 'N/A';
              
              let errorRate = 'N/A';
              if (errorMatch) {
                const baseValue = errorMatch[1] !== undefined
                  ? parseFloat(errorMatch[1]) * 100 // rate (0-1) -> percentage
                  : parseFloat(errorMatch[2]);      // already a percentage
                if (!Number.isNaN(baseValue)) {
                  errorRate = baseValue.toFixed(2) + '%';
                }
              }
              
              const rps = rpsMatch ? parseFloat(rpsMatch[1]).toFixed(2) : 'N/A';
              
              // Determine status by checking for "FAILED" or "PASSED" in output
              // Use the actual run number from filename, not array index
              const runNumber = getRunNumber(file);
              const failedPattern = new RegExp(`Run ${runNumber}: FAILED`, 'i');
              const passedPattern = new RegExp(`Run ${runNumber}: PASSED`, 'i');
              
              let status;
              if (failedPattern.test(content)) {
                status = '❌ FAIL';
                failCount++;
              } else if (passedPattern.test(content)) {
                status = '✅ PASS';
                passCount++;
              } else {
                // Fallback: check if final result shows pipeline passed
                if (content.includes('✅ PIPELINE PASSED')) {
                  status = '✅ PASS';
                  passCount++;
                } else if (content.includes('❌ PIPELINE FAILED')) {
                  status = '❌ FAIL';
                  failCount++;
                } else {
                  // Last resort: assume pass if no explicit failure
                  status = '✅ PASS';
                  passCount++;
                }
              }
              
              comment += `| ${idx + 1} | ${p50} | ${p90} | ${p99} | ${rps} | ${errorRate} | ${status} |\n`;
            });
            
            comment += '\n**Thresholds:** P50 < 5ms, P90 < 15ms, P99 < 70ms, RPS >= 100 (±1% tolerance), Error Rate < 1%\n\n';
            
            if (failCount >= 2) {
              comment += '❌ **Result:** FAILED - ' + failCount + ' out of 3 runs showed regression\n';
            } else {
              comment += '✅ **Result:** PASSED - Only ' + failCount + ' out of 3 runs failed (threshold: 2)\n';
            }
            
            comment += '\n*P50, P90, and P99 percentiles naturally filter out outliers*';
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Display Keploy test cases
        if: always()
        working-directory: keploy
        run: ./.github/workflows/test_workflow_scripts/performance/display-test-cases.sh
