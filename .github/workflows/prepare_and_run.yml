name: Prepare Binary and Run Workflows
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # One group per PR / branch spanning all three platform legs. A new
  # push cancels in-progress Linux, macOS, and Windows jobs together,
  # which means a concurrency-cancel also aborts `cleanup_windows` /
  # `clean_up_docker_macos` mid-run and can leak the run's
  # workflow-lock file or long-running containers on self-hosted
  # runners. The subsequent push schedules fresh cleanup jobs with
  # their own `if: always()`, so state converges within one extra
  # push. Splitting into per-OS sub-groups would avoid the
  # blast-radius, but self-hosted queueing already serialises the
  # macOS / Windows runners in practice; keeping one group keeps the
  # workflow simple.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Central ref for the keploy/integrations commit every build leg in
  # this workflow checks out. Keeping it in one place means the 4
  # Add-Private-Parsers steps below (linux/amd64, linux/arm64,
  # darwin/arm64, windows/amd64) cannot drift apart when the ref is
  # bumped. Prefer the repo-level `vars.INTEGRATION_REF` when set (so
  # operators can override without editing this file), falling back to
  # `main`. Kept in sync with release.yml + golangci-lint.yml so all
  # three workflows track the same integrations ref. Pin to a specific
  # SHA via the repo var if a feat branch needs to carry a cross-repo
  # change.
  INTEGRATION_REF: ${{ vars.INTEGRATION_REF || 'main' }}

jobs:
  # -------------------------------------------------------------------
  # Binary builds
  # -------------------------------------------------------------------

  build-and-upload:
    # Linux amd64 binaries (race + non-race). `build` = race,
    # consumed by most linux docker tests via download-binary.
    # `build-no-race` = non-race, consumed by the linux/amd64
    # docker image (race runtime's memory baseline trips
    # go-memory-load's threshold; race coverage is preserved in the
    # native-linux test path that uses `build`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Private Parsers
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Build Keploy (non-race)
        # CGO_ENABLED=1 explicit so the pg_query_go (libpg_query) cgo
        # link succeeds. ubuntu-latest ships gcc out-of-the-box; on
        # native linux Go already defaults CGO_ENABLED to 1, but we
        # pin it so a cross-compile slipping in here fails loud
        # instead of silently producing a non-cgo binary that
        # panics on first pg_query.Parse call.
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p out/build-no-race
          go build -tags=viper_bind_struct -o out/build-no-race/keploy
      - uses: actions/upload-artifact@v4
        with:
          name: build-no-race
          path: out/build-no-race/keploy

      - name: Build Keploy (race)
        env:
          CGO_ENABLED: "1"   # race requires cgo; on ubuntu-latest it's fine
        run: |
          mkdir -p out/build
          go build -race -tags=viper_bind_struct -o out/build/keploy
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/build/keploy

  build-linux-arm64:
    # Non-race native arm64 linux build — consumed only by the
    # linux/arm64 docker image (which the macOS self-hosted runner
    # loads). Native build avoids qemu emulation on amd64 runners.
    #
    # We deliberately drop -race for docker images: the race
    # runtime roughly doubles binary size and inflates baseline
    # memory (enough to trip go-memory-load's 250 MiB in-container
    # threshold), and any genuine data-race should be caught by
    # the native linux job's race-enabled `build` artifact —
    # docker-replay coverage is about integration semantics, not
    # race detection. This mirrors the effective historic
    # behaviour where update-docker.sh's add_race_flag regex
    # silently failed to match, so the previous linux docker image
    # was also non-race despite the CI script's intent.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Add Private Parsers
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Build Keploy (non-race, linux/arm64)
        # CGO_ENABLED=1 explicit — see the build-and-upload job
        # comment. ubuntu-24.04-arm ships gcc; the aarch64 default
        # CGO_ENABLED matches the amd64 one.
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p out/build-no-race-linux-arm64
          go build -tags=viper_bind_struct -o out/build-no-race-linux-arm64/keploy
      - uses: actions/upload-artifact@v4
        with:
          name: build-no-race-linux-arm64
          path: out/build-no-race-linux-arm64/keploy

  build-darwin-arm64:
    # darwin/arm64 binary for the macOS self-hosted native tests.
    #
    # Session P: moved from ubuntu-latest (linux→darwin/arm64
    # cross-compile, CGO_ENABLED=0) to macos-latest (native arm64
    # build, CGO_ENABLED=1). pg_query_go links libpg_query via cgo
    # and a linux runner cannot cross-compile darwin cgo without an
    # osxcross toolchain, which is heavy to maintain for a single
    # build leg. macos-latest is already arm64 on the GitHub-hosted
    # fleet so the build is native (no cross-compile).
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Private Parsers
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Build Keploy (darwin/arm64)
        # Native arm64 build — macos-latest GHA runners are
        # Apple-silicon as of 2024. GOOS/GOARCH left unset so the
        # build uses the host arch (darwin/arm64); CGO_ENABLED
        # defaults to 1 on native builds.
        run: |
          go build -tags=viper_bind_struct -ldflags="-X main.version=${{ github.sha }}" -o keploy
      - uses: actions/upload-artifact@v4
        with:
          name: build-darwin
          path: keploy

  build-windows-amd64:
    # Native windows/amd64 cgo build on a GitHub-hosted runner.
    #
    # Native rather than cross-compiled because
    # pkg/agent/hooks/windows/redirector.go is `//go:build windows &&
    # amd64` and cgo-links the in-repo libwindows_redirector.a against
    # -lws2_32/-luserenv/-lntdll/-ladvapi32; the linux -> windows cross
    # path does not handle that reliably.
    #
    # Hosted rather than self-hosted because nothing in this job needs
    # the fleet: no Docker, no WinDivert kernel driver, no admin
    # rights, no licensed software and no private network. The only
    # non-public dependency (keploy/integrations) is fetched over
    # public github.com by the setup-private-parsers action, and the
    # 20 MB libwindows_redirector.a is committed in-repo. release.yml's
    # `build-windows` job runs the identical windows/amd64 cgo build on
    # windows-latest and ships every Windows release binary from it, so
    # this configuration is proven in this repo rather than new.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    # Bound the wall-clock so a hung cgo link step (historically: a
    # deadlock inside libwindows_redirector.a's shutdown path) cannot
    # sit on a runner for GitHub's 6h default. A healthy hosted run is
    # ~5 min end to end with a cold module cache; 30 gives 6x headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # persist-credentials/clean are belt-and-braces on an
          # ephemeral hosted VM (the workspace is destroyed with the
          # job), but they cost nothing and keep the checkout token out
          # of .git/config. fetch-depth: 0 is carried over unchanged
          # and matches release.yml's build-windows; nothing in this
          # job reads git history (main.version is stamped from the
          # github.sha context), so it is ~11s of insurance, not a
          # requirement.
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Add Private Parsers
        uses: ./.github/actions/setup-private-parsers
        with:
          ssh-private-key: ${{ secrets.INTEGRATIONS_REPO_DEPLOY_KEY_PRIVATE }}
          # Was false only because the self-hosted disk sweep could
          # delete GOMODCACHE mid-job. That sweep is gone, so cache
          # like release.yml's build-windows does.
          go-cache: true
          # See INTEGRATION_REF in the workflow-level env block.
          integration-ref: ${{ env.INTEGRATION_REF }}

      - name: Ensure MinGW gcc on PATH
        # Shared with release.yml's build-windows so the PR build and
        # the shipped binary can never resolve different toolchains —
        # see the script header for why the two inline copies this
        # replaces were a latent hazard.
        shell: pwsh
        run: |
          $script = Join-Path $Env:GITHUB_WORKSPACE '.github/scripts/windows/ensure-mingw.ps1'
          & $script

      - name: CGO toolchain sanity
        # Fails fast here (exit 127 on a missing gcc) instead of
        # letting the cgo link stage fail 3 minutes into `go build`.
        shell: bash
        run: |
          gcc --version
          go env CGO_ENABLED CC CXX GOOS GOARCH

      - name: Build Keploy (PR) - Windows (windows/amd64)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go build -tags=viper_bind_struct -ldflags="-X main.version=${{ github.sha }}" -o keploy.exe ./main.go

      - name: Upload build artifact (Windows CLI)
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: keploy.exe

  upload-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Upload latest release
        run: |
          # Fetch the latest released keploy binary. Use the
          # /releases/latest/download/ redirect instead of an unauthenticated
          # api.github.com call: that API is rate-limited to 60 req/hr/IP on
          # shared runners, and when it throttles `jq .tag_name` returns null,
          # the download URL 404s, and `curl -L` (no -f) silently saves the
          # HTML error page so `tar` dies with "not in gzip format". -f fails
          # on any HTTP error, --retry rides out transient blips, and the gzip
          # check turns a bad asset into a clear message, not a cryptic tar error.
          URL="https://github.com/keploy/keploy/releases/latest/download/keploy_linux_amd64.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 "$URL" -o keploy.tar.gz
          if ! gzip -t keploy.tar.gz 2>/dev/null; then
            echo "::error::Downloaded keploy.tar.gz is not a valid gzip archive (latest release asset unavailable?)"
            head -c 200 keploy.tar.gz || true
            exit 1
          fi
          tar -xzf keploy.tar.gz
          chmod +x keploy
      - uses: actions/upload-artifact@v4
        with: { name: latest, path: keploy }

  # -------------------------------------------------------------------
  # Docker image builds — produce tarballs as artifacts that every
  # downstream docker test job (linux / macOS / windows) loads via
  # actions/download-artifact + docker load. Replaces the previous
  # ttl.sh pipeline; saves the in-docker `go build` step because the
  # binary is already produced by build-and-upload / build-linux-arm64.
  # -------------------------------------------------------------------

  build-docker-image-amd64:
    # Fork-guard: linux/amd64 consumers (run_*_docker) all skip on
    # fork PRs, and the Windows self-hosted leg is gated too. Building
    # and uploading an image tarball that no downstream job will load
    # just burns runner minutes.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the non-race amd64 binary: see build-linux-arm64's
      # header comment for the rationale. go-memory-load and
      # proxy-stress-test both rely on docker binaries not carrying
      # race-runtime overhead (memory baseline / data-race noise).
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: build-no-race
          path: dist/keploy-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        run: |
          chmod +x dist/keploy-linux-amd64/keploy
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --file Dockerfile.runtime \
            --output type=docker,dest=image.tar \
            -t keploy/keploy:ci \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-linux-amd64
          path: image.tar
          # 7 days so re-running a failed downstream gate within a
          # week still finds the image. Two tarballs per run is cheap.
          retention-days: 7

  build-docker-image-arm64:
    needs: [build-linux-arm64]
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: build-no-race-linux-arm64
          path: dist/keploy-linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/arm64)
        run: |
          chmod +x dist/keploy-linux-arm64/keploy
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --file Dockerfile.runtime \
            --output type=docker,dest=image.tar \
            -t keploy/keploy:ci \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-linux-arm64
          path: image.tar
          # 7 days so re-running a failed downstream gate within a
          # week still finds the image. Two tarballs per run is cheap.
          retention-days: 7

  # -------------------------------------------------------------------
  # Linux test jobs
  # -------------------------------------------------------------------

  run_golang_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/golang_linux.yml
  run_golang_wsl:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/golang_wsl.yml
  run_java_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/java_linux.yml
  run_node_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/node_linux.yml
  run_node_docker:
    needs: [build-and-upload, upload-latest, build-docker-image-amd64]
    uses: ./.github/workflows/node_docker.yml
  run_python_docker:
    needs: [build-and-upload, upload-latest, build-docker-image-amd64]
    uses: ./.github/workflows/python_docker.yml
  run_python_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/python_linux.yml
  run_http_stale_pool_race_linux:
    # Regression guard for issue #4165 (upstream-pool half-close race
    # in handleHttp1ZeroCopy). Bursty client + gunicorn --keep-alive 2
    # exposes the race; the matrix runs both `build` (must pass) and
    # `latest` (currently demonstrates the bug, continue-on-error).
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/http-stale-pool-race-linux.yml
  run_outbound_fin_stall_linux:
    # Regression guard for issue #4173 (relay forwarder join stall on
    # upstream FIN during outbound capture). urllib3 client + fake
    # upstream that FINs after idle exposes the bug; matrix runs both
    # `build` (must pass) and `latest` (currently demonstrates the
    # bug — call-2 hits the 60s read_timeout, continue-on-error).
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/outbound-fin-stall-linux.yml
  run_startup_mock_capture_linux:
    # Regression guard for a once-per-boot startup mock (e.g. an AWS
    # Secret Manager fetch at boot) being dropped from some recorded test
    # sets. The app fetches a secret at startup before serving; the guard
    # records two test sets and asserts the mock landed in both. Precise
    # coverage is in the Go unit tests under pkg/agent/proxy/syncMock.
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/startup-mock-capture-linux.yml
  run_golang_docker:
    needs: [build-and-upload, upload-latest, build-docker-image-amd64]
    uses: ./.github/workflows/golang_docker.yml
  run_fuzzer_linux:
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/fuzzer_linux.yml
    secrets:
      AZURE_FUZZER_SAS_RO: ${{ secrets.AZURE_FUZZER_SAS_RO }}
      PRO_ACCESS_TOKEN: ${{ secrets.PRO_ACCESS_TOKEN }}
  run_grpc_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/grpc_linux.yml
  run_schema_match_linux:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/schema_match_linux.yml
  # End-to-end coverage for --capture-packets: drives a real
  # outbound-HTTPS workload through the keploy proxy and verifies the
  # streamed traffic.pcap + sslkeys.log decrypt cleanly with tshark.
  run_sample_tls_pcap:
    needs: [build-and-upload, upload-latest]
    uses: ./.github/workflows/sample_tls_pcap.yml

  # -------------------------------------------------------------------
  # macOS test jobs — self-hosted runner loads the linux/arm64 image
  # (Docker Desktop on Apple Silicon runs linux containers natively).
  # -------------------------------------------------------------------

  precheck-macos:
    # Pre-flight sanity on the self-hosted macOS runner: create the
    # workflow start lock that clean_up_docker_macos consumes, unlock
    # the keychain, and confirm Docker Desktop is up. Fails fast
    # BEFORE the parallel test jobs spin up, so a runner that booted
    # without Docker Desktop doesn't waste 10 min of downstream time.
    # The docker image itself is loaded inside each downstream test
    # job via the download-image composite action — pre-loading here
    # would duplicate the artifact download + docker load for every
    # test job.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: [self-hosted, macOS, native]
    timeout-minutes: 10
    steps:
      - name: Create workflow start lock
        run: |
          LOCK_DIR="$HOME/.github-workflow-locks"
          mkdir -p "$LOCK_DIR"
          echo "started-$(date +%s)" > "$LOCK_DIR/prepare-macos-workflow-${{ github.run_id }}.lock"

      - name: Unlock keychain
        if: runner.os == 'macOS'
        run: |
          security unlock-keychain -p $KEYCHAIN_PASSWORD
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_RUNNER_USER_PASSWORD }}

      - name: Verify Docker Desktop is running (macOS)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Docker Desktop is not running."
            echo "Ensure Docker Desktop is configured as a Login Item on the self-hosted runner."
            exit 1
          fi
          echo "Docker Desktop is running."

  run_python_docker_macos:
    needs: [build-darwin-arm64, precheck-macos, build-docker-image-arm64]
    uses: ./.github/workflows/python_docker_macos.yml
    secrets:
      MAC_RUNNER_USER_PASSWORD: ${{ secrets.MAC_RUNNER_USER_PASSWORD }}

  run_golang_docker_macos:
    needs: [build-darwin-arm64, precheck-macos, build-docker-image-arm64]
    uses: ./.github/workflows/golang_docker_macos.yml
    secrets:
      MAC_RUNNER_USER_PASSWORD: ${{ secrets.MAC_RUNNER_USER_PASSWORD }}

  clean_up_docker_macos:
    if: ${{ always() && ((github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, macOS, native]
    needs: [run_python_docker_macos, run_golang_docker_macos]
    timeout-minutes: 10
    steps:
      - name: Verify Docker Desktop is running (macOS)
        continue-on-error: true
        run: |
          if docker info >/dev/null 2>&1; then
            echo "Docker Desktop is running."
          else
            echo "WARNING: Docker Desktop is not running. Cleanup will be skipped."
          fi

      - name: Unlock keychain
        if: runner.os == 'macOS'
        run: |
          security unlock-keychain -p $KEYCHAIN_PASSWORD
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_RUNNER_USER_PASSWORD }}

      - name: Remove workflow lock file
        if: always()
        run: |
          LOCK_DIR="$HOME/.github-workflow-locks"
          LOCK_FILE="$LOCK_DIR/prepare-macos-workflow-${{ github.run_id }}.lock"

          if [ -f "$LOCK_FILE" ]; then
            echo "Removing workflow lock file: $LOCK_FILE"
            rm -f "$LOCK_FILE"
          else
            echo "Lock file not found (may have been cleaned up already): $LOCK_FILE"
          fi

          echo "Cleaning up stale lock files older than 24 hours..."
          find "$LOCK_DIR" -name "prepare-macos-workflow-*.lock" -type f -mtime +1 -delete 2>/dev/null || true

      - name: Stop long-running containers (macOS)
        id: stop_longrunning
        run: |
          # Stop containers running longer than 30 minutes, except buildx containers.
          stopped_any=0
          now=$(date +%s)
          while read -r cid cname; do
            started=$(docker inspect --format '{{.State.StartedAt}}' "$cid" 2>/dev/null || true)
            if [ -z "$started" ]; then
              continue
            fi
            started_norm=$(echo "$started" | sed -E 's/\.[0-9]+//; s/Z$/+0000/; s/([+-][0-9]{2}):([0-9]{2})$/\1\2/')
            epoch=$(date -j -f "%Y-%m-%dT%H:%M:%S%z" "$started_norm" "+%s" 2>/dev/null || echo 0)
            if [ -z "$epoch" ] || [ "$epoch" -eq 0 ]; then
              echo "Could not parse start time for container $cid: $started"
              continue
            fi
            if [ "$epoch" -lt $((now - 1800)) ]; then
              if [[ "$cname" == buildx* ]]; then
                echo "Skipping buildx container $cid ($cname)"
                continue
              fi
              echo "Removing long-running container $cid ($cname) started at $started"
              docker rm -f "$cid" || true
              stopped_any=1
            fi
          done < <(docker ps -a --format '{{.ID}} {{.Names}}')
          echo "stopped_any=$stopped_any" >> $GITHUB_OUTPUT

      - name: Docker cleanup (scoped to this workflow run)
        run: |
          echo "Cleaning up resources for run ${{ github.run_id }}..."

          if ! docker info >/dev/null 2>&1; then
            echo "Docker is not available, skipping cleanup."
            exit 0
          fi

          RUN_ID="${{ github.run_id }}"
          for prefix in ginApp_ mongoDb_ keploy_ginmongo_ echoApp_ postgresDb_ keploy_ flaskApp_ mongo_; do
            ids=$(docker ps -aq --filter "name=${prefix}${RUN_ID}" 2>/dev/null || true)
            if [ -n "$ids" ]; then
              docker rm -f $ids 2>/dev/null || true
            fi
          done

          for net in $(docker network ls --format '{{.Name}}' | grep -E "^keploy-network-${RUN_ID}-" 2>/dev/null); do
            docker network rm "$net" 2>/dev/null || true
          done

          echo "Pruning dangling Docker images..."
          docker image prune -f 2>/dev/null || true
          echo "Pruning dangling Docker volumes..."
          docker volume prune -f 2>/dev/null || true

          echo "Docker cleanup completed."

  # -------------------------------------------------------------------
  # Windows test jobs. Two lanes with different runner requirements:
  #
  #   * run_golang_native_windows — GitHub-hosted (windows-latest). Runs
  #     keploy.exe directly against native sample apps; needs only the
  #     WinDivert driver the artifact carries.
  #   * run_golang_docker_windows — self-hosted, gated on
  #     precheck-windows. Loads the linux/amd64 image and drives it from
  #     the Windows keploy.exe, which requires Docker Desktop's WSL2
  #     Linux engine (the sample stack and keploy's injected eBPF agent
  #     sidecar are Linux containers). Hosted Windows runners ship
  #     Docker in Windows-container mode only, so this lane cannot move.
  # -------------------------------------------------------------------

  precheck-windows:
    # Pre-flight sanity on the self-hosted Windows runner: create the
    # workflow start lock that cleanup_windows consumes, set up per-job
    # git isolation, and start/confirm Docker Desktop. Fails fast
    # BEFORE the parallel Windows test jobs spin up. The docker image
    # itself is loaded inside each downstream test job via the
    # download-image composite action — pre-loading here would
    # duplicate the artifact download + docker load for every test.
    #
    # Stays self-hosted: its load-bearing step launches Docker Desktop,
    # which is what gives run_golang_docker_windows a LINUX-container
    # engine on a Windows host. GitHub-hosted Windows runners ship
    # Docker in Windows-container mode only and cannot run the
    # linux/amd64 sample stack or keploy's eBPF agent sidecar.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: [self-hosted, Windows, X64]
    # Bound the wall-clock so a hung self-hosted Windows runner cannot
    # stall the whole pipeline.
    timeout-minutes: 30
    steps:
      # Marks "a Windows run is live on this shared VM" for
      # cleanup-windows.ps1, which only runs its destructive
      # `docker system prune -af --volumes` when NO lock files remain.
      # This lock used to be written by build-windows-amd64; that job
      # now runs on an ephemeral GitHub-hosted VM whose $USERPROFILE
      # the self-hosted cleanup can never see, so the writer moved here
      # — the earliest self-hosted job in the Windows lane, and the
      # mirror of precheck-macos. Without a writer, cleanup would find
      # zero locks on every run and prune a concurrent run's images and
      # volumes mid-`docker compose up`.
      - name: Create workflow start lock
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $lockDir = Join-Path $env:USERPROFILE '.github-workflow-locks'
          New-Item -Path $lockDir -ItemType Directory -Force | Out-Null
          $timestamp = (Get-Date -UFormat %s)
          $lockPath = Join-Path $lockDir "prepare-windows-workflow-$($env:GITHUB_RUN_ID).lock"
          Set-Content -Path $lockPath -Value "started-$timestamp"
          Write-Host "Created workflow start lock: $lockPath"

      - name: Report fleet disk headroom
        # The self-hosted fleet's only remaining reclamation is
        # cleanup-windows.ps1's docker prune, which runs in a job with
        # `continue-on-error: true` that nothing depends on — so a fleet
        # filling up produces no signal anywhere. This is that signal.
        #
        # It lives HERE, in precheck-windows, deliberately: precheck is
        # the earliest self-hosted Windows job AND is still a gate input,
        # so an exhausted runner red-lights the PR with an actionable
        # message instead of surfacing as a mid-build "no space left"
        # three jobs later.
        #
        # Observe-only above the floor. It does NOT delete anything: the
        # 98-line sweep this replaces used to purge GOMODCACHE and walk
        # C:\actions-runners, which raced concurrent jobs on the shared
        # box. Reporting is what was actually missing.
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $c = Get-PSDrive -Name C
          $freeGB = [math]::Round($c.Free / 1GB, 2)
          $usedGB = [math]::Round($c.Used / 1GB, 2)
          Write-Host "C: free ${freeGB} GB (used ${usedGB} GB) on $($env:COMPUTERNAME)"

          if ($freeGB -lt 2) {
            Write-Host "::error::Windows runner $($env:COMPUTERNAME) has only ${freeGB} GB free on C:. A CGO build plus a docker image load needs more than this; the runner operator should expand the volume or prune the docker cache."
            exit 1
          }
          elseif ($freeGB -lt 6) {
            Write-Host "::warning::Windows runner $($env:COMPUTERNAME) is low on disk: ${freeGB} GB free on C:. Cleanup is falling behind — check that cleanup_windows is still pruning."
          }

      # Create a minimal per-job gitconfig BEFORE checkout to prevent
      # concurrent jobs' SSH redirects from leaking into our checkout.
      - name: Pre-checkout git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $isoName = $env:GIT_ISOLATION_ID
          if ([string]::IsNullOrWhiteSpace($isoName)) {
            $isoName = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB-$([guid]::NewGuid().ToString('N'))"
            $isoName = $isoName -replace '[^A-Za-z0-9._-]', '_'
          }
          $isoDir = Join-Path (Join-Path $env:USERPROFILE ".git-isolation") $isoName
          New-Item -Path $isoDir -ItemType Directory -Force | Out-Null
          $gitConfig = Join-Path $isoDir 'gitconfig'
          New-Item -Path $gitConfig -ItemType File -Force | Out-Null
          git config --file $gitConfig core.autocrlf false
          git config --file $gitConfig core.eol lf
          "GIT_CONFIG_GLOBAL=$gitConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_ISOLATION_ID=$isoName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Self-hosted only: the workspace and the machine persist between
      # runs, so a prior run interrupted mid-cleanup can leave a
      # keploy.exe holding handles on WinDivert64.sys, the WinDivert
      # kernel driver service still loaded, or a workspace with files
      # but no .git. All three make actions/checkout's clean:true fail
      # (EPERM on unlink, or "not a git repository"). The inline
      # comments below cover each case.
      - name: Recover stale runner state
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            # 1. Kill any keploy processes left over from a prior run on this
            #    self-hosted runner. They hold open file handles into the
            #    workspace bin/ (notably WinDivert64.sys, the kernel driver
            #    keploy uses for Windows traffic redirection), which makes
            #    actions/checkout's clean step fail with EPERM on unlink.
            Get-Process -Name 'keploy' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Stopping leftover keploy.exe pid=$($_.Id)"
              try { $_ | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
            }

            # 2. Stop the WinDivert kernel driver if it's still loaded.
            #    keploy registers it as an SCM service named "WinDivert"
            #    (or "WinDivert64" on some versions); leaving it running
            #    pins the .sys file in the workspace and causes the same
            #    EPERM observed at checkout-clean time.
            foreach ($name in @('WinDivert', 'WinDivert64')) {
              $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne 'Stopped') {
                Write-Host "Stopping kernel driver service $name (status=$($svc.Status))"
                try { Stop-Service -Name $name -Force -ErrorAction SilentlyContinue } catch {}
              }
            }

            # 3. If a prior run was interrupted partway through cleanup the
            #    workspace can end up with files but no .git, which makes
            #    actions/checkout's clean:true fail with "not a git
            #    repository". Wipe in that case so checkout starts fresh.
            #    Healthy workspaces (with valid .git) are left alone so the
            #    existing fast path (clean+fetch over an existing clone)
            #    keeps working.
            $ws = $env:GITHUB_WORKSPACE
            if ($ws -and (Test-Path $ws)) {
              $gitDir = Join-Path $ws '.git'
              $items = @(Get-ChildItem -Path $ws -Force -ErrorAction SilentlyContinue)
              $hasFiles = $items.Count -gt 0
              if ($hasFiles -and -not (Test-Path $gitDir)) {
                Write-Host "::warning::Workspace $ws has files but no .git -- wiping for fresh checkout (prior run was interrupted)"
                Remove-Item -Path (Join-Path $ws '*') -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "::warning::Recover stale runner state: $_"
          }
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup per-job git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\setup-git-isolation.ps1"

      - name: Ensure Docker is running
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $script = Join-Path $Env:GITHUB_WORKSPACE '.github/scripts/windows/ensure-docker.ps1'
          if (Test-Path $script) { & $script } else { Write-Error "Required helper script not found: $script"; exit 1 }

      - name: Wait for Docker to be ready
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $maxAttempts = 30
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              $result = docker info 2>&1
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Docker is ready after $attempt attempts"
                break
              }
            } catch {}
            Write-Host "Waiting for Docker... attempt $attempt/$maxAttempts"
            Start-Sleep -Seconds 2
          }
          if ($attempt -eq $maxAttempts) {
            Write-Error "Docker did not become ready in time"
            exit 1
          }

      - name: Prune stale git isolation dirs
        if: always()
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\cleanup-git-isolation.ps1"

  run_golang_docker_windows:
    needs: [build-windows-amd64, build-docker-image-amd64, precheck-windows]
    uses: ./.github/workflows/golang_docker_windows.yml

  run_golang_native_windows:
    needs: [build-windows-amd64]
    uses: ./.github/workflows/golang_native_windows.yml

  cleanup_windows:
    # Disk hygiene for the shared self-hosted Windows VM: drop this
    # run's workflow lock, kill containers older than 30 min, and prune
    # Docker once no other run holds a lock. Stays self-hosted by
    # definition — there is nothing to reclaim on an ephemeral hosted
    # VM that is destroyed at job end.
    if: ${{ always() && ((github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, Windows, X64]
    # Only the docker lane touches this VM. run_golang_native_windows
    # runs entirely on GitHub-hosted windows-latest, so waiting on it
    # would just park a self-hosted runner slot behind machines this
    # job can never affect.
    needs: [run_golang_docker_windows]
    # The only self-hosted job in the repo that had no cap, so it inherited
    # GitHub's 360-minute default. Because it is `if: always()`, a Windows
    # fleet that is busy or offline parks it in the queue and the ENTIRE run
    # stays in_progress behind it for six hours — the PR shows no verdict and
    # `gh run rerun --failed` refuses, because that requires a completed run.
    # Observed on run 30620482988: 60+ minutes queued with zero steps executed
    # while every other job had long finished. (`gate_windows` no longer needs
    # this job, so a slow cleanup no longer blocks the Windows verdict itself,
    # but it still holds the run open.) 10 minutes matches its macOS twin
    # `clean_up_docker_macos`; the work itself is `docker rm -f` and a
    # lock-file delete. Losing a cleanup pass is cheap and self-correcting —
    # the next push schedules a fresh one, as the concurrency comment at the
    # top of this file already notes.
    timeout-minutes: 10
    steps:
      - name: Pre-checkout git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $isoName = $env:GIT_ISOLATION_ID
          if ([string]::IsNullOrWhiteSpace($isoName)) {
            $isoName = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB-$([guid]::NewGuid().ToString('N'))"
            $isoName = $isoName -replace '[^A-Za-z0-9._-]', '_'
          }
          $isoDir = Join-Path (Join-Path $env:USERPROFILE ".git-isolation") $isoName
          New-Item -Path $isoDir -ItemType Directory -Force | Out-Null
          $gitConfig = Join-Path $isoDir 'gitconfig'
          New-Item -Path $gitConfig -ItemType File -Force | Out-Null
          git config --file $gitConfig core.autocrlf false
          git config --file $gitConfig core.eol lf
          "GIT_CONFIG_GLOBAL=$gitConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_ISOLATION_ID=$isoName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Self-hosted only: the workspace and the machine persist between
      # runs, so a prior run interrupted mid-cleanup can leave a
      # keploy.exe holding handles on WinDivert64.sys, the WinDivert
      # kernel driver service still loaded, or a workspace with files
      # but no .git. All three make actions/checkout's clean:true fail
      # (EPERM on unlink, or "not a git repository"). The inline
      # comments below cover each case.
      - name: Recover stale runner state
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            # 1. Kill any keploy processes left over from a prior run on this
            #    self-hosted runner. They hold open file handles into the
            #    workspace bin/ (notably WinDivert64.sys, the kernel driver
            #    keploy uses for Windows traffic redirection), which makes
            #    actions/checkout's clean step fail with EPERM on unlink.
            Get-Process -Name 'keploy' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Stopping leftover keploy.exe pid=$($_.Id)"
              try { $_ | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
            }

            # 2. Stop the WinDivert kernel driver if it's still loaded.
            #    keploy registers it as an SCM service named "WinDivert"
            #    (or "WinDivert64" on some versions); leaving it running
            #    pins the .sys file in the workspace and causes the same
            #    EPERM observed at checkout-clean time.
            foreach ($name in @('WinDivert', 'WinDivert64')) {
              $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne 'Stopped') {
                Write-Host "Stopping kernel driver service $name (status=$($svc.Status))"
                try { Stop-Service -Name $name -Force -ErrorAction SilentlyContinue } catch {}
              }
            }

            # 3. If a prior run was interrupted partway through cleanup the
            #    workspace can end up with files but no .git, which makes
            #    actions/checkout's clean:true fail with "not a git
            #    repository". Wipe in that case so checkout starts fresh.
            #    Healthy workspaces (with valid .git) are left alone so the
            #    existing fast path (clean+fetch over an existing clone)
            #    keeps working.
            $ws = $env:GITHUB_WORKSPACE
            if ($ws -and (Test-Path $ws)) {
              $gitDir = Join-Path $ws '.git'
              $items = @(Get-ChildItem -Path $ws -Force -ErrorAction SilentlyContinue)
              $hasFiles = $items.Count -gt 0
              if ($hasFiles -and -not (Test-Path $gitDir)) {
                Write-Host "::warning::Workspace $ws has files but no .git -- wiping for fresh checkout (prior run was interrupted)"
                Remove-Item -Path (Join-Path $ws '*') -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "::warning::Recover stale runner state: $_"
          }
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup per-job git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\setup-git-isolation.ps1"

      - name: Remove workflow start lock
        # `if: always()` is load-bearing, and newly so. cleanup-windows.ps1
        # only prunes when NO lock files remain, so a leaked lock disables
        # the shared VM's last disk reclamation permanently and silently.
        # Three unguarded steps run before this one (git isolation, checkout,
        # git isolation again) and setup-git-isolation.ps1 throws when
        # ssh-keyscan comes back empty — a real fleet condition. Without
        # always(), that throw strands the lock forever.
        #
        # The 24h reaper mirrors the macOS twin ("Remove workflow lock file"),
        # and is the backstop for locks stranded by a cancelled or
        # hard-killed run, which no `if:` can cover.
        if: always()
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $lockDir = Join-Path $env:USERPROFILE '.github-workflow-locks'
          $lockPath = Join-Path $lockDir "prepare-windows-workflow-$($env:GITHUB_RUN_ID).lock"
          Remove-Item -Path $lockPath -Force -ErrorAction SilentlyContinue

          Write-Host "Reaping workflow locks older than 24 hours..."
          Get-ChildItem -Path $lockDir -Filter 'prepare-windows-workflow-*.lock' -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-1) } |
            ForEach-Object {
              Write-Host "  reaping stale lock: $($_.Name) (last written $($_.LastWriteTime))"
              Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
            }

      - name: Check and cleanup long-running containers (Windows helper)
        id: count_stash
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoProfile -Command "& ''{0}''"'
        run: |
          $script = Join-Path $Env:GITHUB_WORKSPACE '.github/scripts/windows/cleanup-windows.ps1'
          if (Test-Path $script) {
            & $script
          } else {
            Write-Error "Cleanup script not found at $script"
            exit 1
          }

      - name: Prune stale git isolation dirs
        if: always()
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\cleanup-git-isolation.ps1"

  # -------------------------------------------------------------------
  # Per-platform gates. Names preserved for branch protection so the
  # required-check set does not need to change on merge.
  # -------------------------------------------------------------------

  gate:
    name: CI Gate (Linux)
    if: always()
    needs:
      - build-and-upload
      - upload-latest
      - build-docker-image-amd64
      - run_golang_linux
      - run_golang_wsl
      - run_java_linux
      - run_node_linux
      - run_node_docker
      - run_python_docker
      - run_python_linux
      - run_http_stale_pool_race_linux
      - run_outbound_fin_stall_linux
      - run_startup_mock_capture_linux
      - run_golang_docker
      - run_fuzzer_linux
      - run_grpc_linux
      - run_schema_match_linux
      - run_sample_tls_pcap
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results=( \
            "${{ needs.build-and-upload.result }}" \
            "${{ needs.upload-latest.result }}" \
            "${{ needs.build-docker-image-amd64.result }}" \
            "${{ needs.run_golang_linux.result }}" \
            "${{ needs.run_golang_wsl.result }}" \
            "${{ needs.run_java_linux.result }}" \
            "${{ needs.run_node_linux.result }}" \
            "${{ needs.run_node_docker.result }}" \
            "${{ needs.run_python_docker.result }}" \
            "${{ needs.run_python_linux.result }}" \
            "${{ needs.run_http_stale_pool_race_linux.result }}" \
            "${{ needs.run_outbound_fin_stall_linux.result }}" \
            "${{ needs.run_startup_mock_capture_linux.result }}" \
            "${{ needs.run_golang_docker.result }}" \
            "${{ needs.run_fuzzer_linux.result }}" \
            "${{ needs.run_grpc_linux.result }}" \
            "${{ needs.run_schema_match_linux.result }}" \
            "${{ needs.run_sample_tls_pcap.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more upstream jobs failed or were cancelled. Re-run all jobs, not individual ones."
              exit 1
            fi
          done
          echo "All jobs passed."

  gate_macos:
    name: CI Gate (macOS)
    if: always()
    needs:
      - build-darwin-arm64
      - build-linux-arm64
      - build-docker-image-arm64
      - precheck-macos
      - run_python_docker_macos
      - run_golang_docker_macos
      - clean_up_docker_macos
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results=( \
            "${{ needs.build-darwin-arm64.result }}" \
            "${{ needs.build-linux-arm64.result }}" \
            "${{ needs.build-docker-image-arm64.result }}" \
            "${{ needs.precheck-macos.result }}" \
            "${{ needs.run_python_docker_macos.result }}" \
            "${{ needs.run_golang_docker_macos.result }}" \
            "${{ needs.clean_up_docker_macos.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more upstream jobs failed or were cancelled. Re-run all jobs, not individual ones."
              exit 1
            fi
          done
          echo "All jobs passed."

  gate_windows:
    name: CI Gate (Windows)
    if: always()
    # `cleanup_windows` is deliberately absent: it is self-hosted VM
    # disk hygiene with zero product signal, yet as a gate input it
    # could red-light a PR on its own whenever the fleet was busy or a
    # docker prune hiccuped. Every job below carries real signal.
    # precheck-windows must STAY — because this gate counts `skipped`
    # as a pass, a failed precheck silently skips
    # run_golang_docker_windows, and precheck's own `failure` is then
    # the only thing that surfaces the lost docker-lane coverage.
    needs:
      - build-windows-amd64
      - build-docker-image-amd64
      - precheck-windows
      - run_golang_docker_windows
      - run_golang_native_windows
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results=( \
            "${{ needs.build-windows-amd64.result }}" \
            "${{ needs.build-docker-image-amd64.result }}" \
            "${{ needs.precheck-windows.result }}" \
            "${{ needs.run_golang_docker_windows.result }}" \
            "${{ needs.run_golang_native_windows.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more upstream jobs failed or were cancelled. Re-run all jobs, not individual ones."
              exit 1
            fi
          done
          echo "All jobs passed."
