name: Golang On Docker (Windows)
on:
  workflow_call:

# NO workflow-level concurrency group here on purpose.
#
# This reusable workflow runs on a pool of 4 self-hosted Windows
# runners that share ONE physical VM. It used to carry
#   concurrency: { group: windows-docker-runner, cancel-in-progress: false }
# whose group was a CONSTANT string, so GitHub allowed only ONE run of
# this workflow across the entire repo at a time — every other run
# queued and 3 of the 4 runners sat idle. That constant group was a
# band-aid for the fact that concurrent jobs collided on shared-VM
# resources: the host-published keploy proxy port (-p 127.0.0.1:16789:16789,
# which still allocates the host port and still collides), a
# machine-wide keploy.exe kill that would abort a sibling's CLI, and the
# shared docker-compose project name (network/volumes). (This lane
# intercepts via a per-job eBPF keploy-agent container in the compose
# network, not the host WinDivert driver, so driver coexistence is not
# the concern here.)
#
# Those collisions are now removed at the source: every shared-VM
# resource is made per-job unique and every kill is job-scoped (see
# golang-docker-windows.ps1 and the "Recover stale runner state" step
# below). With the collisions gone, serialization is pure waste, so it
# is deleted — all 4 runners can now pick up jobs in parallel.
#
# Superseded-push cancellation is still handled one level up: the only
# caller, prepare_and_run.yml, sets
#   concurrency: { group: <workflow>-<pr#/ref>, cancel-in-progress: true }
# which cancels the whole run (this job included) when a new commit
# lands on the same PR/branch. The 4-runner pool is the natural
# concurrency cap. This mirrors the other self-hosted Windows lanes,
# which also runs with no concurrency group.

jobs:
  golang_docker_windows:
    runs-on: [self-hosted, Windows, X64]
    # Same hung-shutdown rationale as the other Windows lanes -
    # cap per-job wall-clock at 30 min so a stuck intercepted
    # process cannot hold a self-hosted Windows runner for 6h.
    #
    # Load-bearing for reap-keploy-containers.ps1 and cleanup-windows.ps1 too:
    # they remove other jobs' containers, and treat this job's lock as stale,
    # only past their -MinAgeMinutes, because no live job can own anything
    # older than this timeout. Raising this without raising that fails
    # reap-keploy-containers.tests.ps1.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: go-http-no-deps
            path: go-dedup
            script_dir: go-dedup
        config:
          - job: record_build_replay_build
            record_src: build-windows
            replay_src: build-windows

    name: ${{ matrix.app.name }} (${{ matrix.config.job }}) (Windows)
    steps:
      # Remove stale SSH redirects from global config before checkout
      # so actions/checkout uses HTTPS, not SSH.
      # Create a minimal per-job gitconfig BEFORE checkout to prevent
      # concurrent jobs' SSH redirects from leaking into our checkout.
      - name: Pre-checkout git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $isoName = $env:GIT_ISOLATION_ID
          if ([string]::IsNullOrWhiteSpace($isoName)) {
            $isoName = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB-$([guid]::NewGuid().ToString('N'))"
            $isoName = $isoName -replace '[^A-Za-z0-9._-]', '_'
          }
          $isoDir = Join-Path (Join-Path $env:USERPROFILE ".git-isolation") $isoName
          New-Item -Path $isoDir -ItemType Directory -Force | Out-Null
          $gitConfig = Join-Path $isoDir 'gitconfig'
          New-Item -Path $gitConfig -ItemType File -Force | Out-Null
          git config --file $gitConfig core.autocrlf false
          git config --file $gitConfig core.eol lf
          "GIT_CONFIG_GLOBAL=$gitConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_ISOLATION_ID=$isoName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Clears what an interrupted run of THIS runner left behind, before
      # checkout: its keploy processes, the WinDivert driver when no other
      # keploy uses it, and a workspace without a .git. It runs before the
      # checkout, so its text is .github/scripts/windows/recover-runner-state.ps1
      # verbatim; reap-keploy-containers.tests.ps1 fails if the two differ.
      - name: Recover stale runner state
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          # "Recover stale runner state": the step before actions/checkout in every job
          # on the self-hosted Windows runners. It runs before the checkout, so it cannot
          # call a script from the repository: each such step's run: block is this
          # file's text, and reap-keploy-containers.tests.ps1 fails if one differs.
          #
          # win-runner-1..4 run on ONE machine, so this acts only on what THIS job's
          # runner left behind. It used to stop every process named keploy and the
          # WinDivert driver unconditionally, which kills a sibling job's keploy
          # mid-run and pulls the driver from under the one capturing through it.
          $ErrorActionPreference = 'Continue'
          try {
            $ws = $env:GITHUB_WORKSPACE
            # Each runner has a workspace of its own, so a process's executable path
            # tells whose it is. The trailing separator keeps ...\keploy from matching a
            # sibling ...\keploy2.
            $wsPrefix = $null
            if ($ws) { $wsPrefix = $ws.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar }
            $keploy = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like 'keploy*' })
            $own = @($keploy | Where-Object {
                $_.Path -and $wsPrefix -and $_.Path.StartsWith($wsPrefix, [System.StringComparison]::OrdinalIgnoreCase)
            })

            # 1. This workspace's leftover keploy processes (from an interrupted run of
            #    this runner). They hold files open under the workspace's bin/, notably
            #    WinDivert64.sys, and actions/checkout's clean then fails with EPERM.
            foreach ($p in $own) {
              Write-Host "Stopping this workspace's leftover $($p.ProcessName) pid=$($p.Id) path=$($p.Path)"
              try { $p | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
            }

            # 2. The WinDivert driver keploy registers ("WinDivert", or "WinDivert64")
            #    pins its .sys the same way. It is ONE service for the whole machine,
            #    so it is reset only when no other keploy is running. A keploy whose
            #    path cannot be read counts as another's.
            $others = @($keploy | Where-Object { $own -notcontains $_ })
            if ($others.Count -eq 0) {
              foreach ($name in @('WinDivert', 'WinDivert64')) {
                $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
                if ($svc -and $svc.Status -ne 'Stopped') {
                  Write-Host "No other keploy is running on this machine; stopping the kernel driver service $name (status=$($svc.Status))"
                  try { Stop-Service -Name $name -Force -ErrorAction SilentlyContinue } catch {}
                }
              }
            } else {
              Write-Host "Not resetting the WinDivert driver: $($others.Count) other keploy process(es) are running on this machine, and a sibling job may be capturing through it."
            }

            # 3. A prior run interrupted mid-cleanup can leave the workspace with files
            #    but no .git, and actions/checkout's clean then fails with "not a git
            #    repository". Wipe it so checkout starts fresh; a workspace with a .git
            #    is left alone, so checkout's clean+fetch fast path keeps working.
            if ($ws -and (Test-Path -LiteralPath $ws)) {
              $items = @(Get-ChildItem -LiteralPath $ws -Force -ErrorAction SilentlyContinue)
              if (($items.Count -gt 0) -and -not (Test-Path -LiteralPath (Join-Path $ws '.git'))) {
                Write-Host "::warning::Workspace $ws has files but no .git -- wiping for fresh checkout (prior run was interrupted)"
                Remove-Item -Path (Join-Path $ws '*') -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "::warning::Recover stale runner state: $_"
          }
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Reap leaked keploy agent containers
        # Runs after checkout (the script lives in the repo) but before any
        # keploy work, and fails the job if any container survives
        # removal: a wedged Docker VM makes every keploy run on this runner
        # report connection failures, so starting work on one only produces a
        # misleading result. The guaranteed sweep after a run lives in
        # cleanup-windows.ps1, which warns instead of failing.
        #
        # It first takes this job's Docker lock (take-docker-job-lock.ps1),
        # before any image is built or loaded: while it exists, cleanup_windows
        # of any run on this machine does not start a prune, and a prune that
        # was already running when the lock was taken is waited out here.
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        run: |
          $scripts = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows'
          $takeLock = Join-Path $scripts 'take-docker-job-lock.ps1'
          $reaper = Join-Path $scripts 'reap-keploy-containers.ps1'
          # Say so plainly if the scripts are not there. They live in the repo,
          # so this step must run after checkout; when it did not, PowerShell
          # threw a bare CommandNotFoundException that said nothing about the
          # cause.
          foreach ($f in @($takeLock, $reaper)) {
            if (-not (Test-Path $f)) {
              Write-Host "::error::$f not found - this step must run AFTER 'Checkout repository'."
              exit 1
            }
          }
          $jobLock = & $takeLock | Select-Object -Last 1
          if (-not $jobLock) { Write-Host "::error::could not take this job's Docker lock."; exit 1 }
          "KEPLOY_DOCKER_JOB_LOCK=$jobLock" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $reaper -FailOnStuck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup per-job git isolation
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"' 
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\setup-git-isolation.ps1"

      # --- CLI binaries (same as before) ---
      - name: Download Record Binary (${{ matrix.config.record_src }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.config.record_src }}
          path: record-bin

      - name: Install Record Binary
        id: setup_record
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"' 
        run: |
          New-Item -Path "./bin" -ItemType Directory -Force | Out-Null
          Move-Item -Path ".\record-bin\keploy.exe" -Destination ".\bin\keploy-record.exe" -Force
          echo "$env:GITHUB_WORKSPACE/bin" >> $env:GITHUB_PATH
          echo "bin_name=keploy-record.exe" >> $env:GITHUB_OUTPUT

      - name: Download Replay Binary (${{ matrix.config.replay_src }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.config.replay_src }}
          path: replay-bin

      - name: Install Replay Binary
        id: setup_replay
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"' 
        run: |
          New-Item -Path "./bin" -ItemType Directory -Force | Out-Null
          Move-Item -Path ".\replay-bin\keploy.exe" -Destination ".\bin\keploy-replay.exe" -Force
          echo "bin_name=keploy-replay.exe" >> $env:GITHUB_OUTPUT

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64
          version: ${{ github.sha }}

      - name: Checkout the samples-go repository
        uses: actions/checkout@v4
        with:
          repository: keploy/samples-go
          path: samples-go
          clean: true

      # Your existing run step
      - name: Run ${{ matrix.app.name }} application (Windows)
        # Its id feeds "Remove this job's containers". The script must call
        # register-job-compose-project.ps1 before it starts any container.
        id: run_app
        env:
          RECORD_BIN:  ${{ steps.setup_record.outputs.bin_name }}
          REPLAY_BIN:  ${{ steps.setup_replay.outputs.bin_name }}
          # DOCKER_IMAGE_RECORD: ${{ steps.record_img.outputs.image }}
          # DOCKER_IMAGE_REPLAY: ${{ steps.replay_img.outputs.image }}
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"' 
        run: |
          cd samples-go/${{ matrix.app.path }}
          & "$env:GITHUB_WORKSPACE\.github\workflows\test_workflow_scripts\golang\${{ matrix.app.script_dir }}\golang-docker-windows.ps1"

      # The owner's half of the container rule: remove every container this
      # job started (the compose project the run step recorded) and release
      # the job's Docker lock. remove-job-containers.ps1 says why a wedge is
      # only a warning here, and warns when a job that started containers
      # recorded no project.
      - name: Remove this job's containers
        if: always()
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"'
        env:
          KEPLOY_START_STEP_OUTCOME: ${{ steps.run_app.outcome }}
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows\remove-job-containers.ps1'
          if (-not (Test-Path $script)) {
            Write-Host "::warning::$script not found; leaving this job's containers to the age sweep."
            if ($env:KEPLOY_DOCKER_JOB_LOCK) { Remove-Item -LiteralPath $env:KEPLOY_DOCKER_JOB_LOCK -Force -ErrorAction SilentlyContinue }
            exit 0
          }
          & $script
          exit $LASTEXITCODE

      - name: Prune stale git isolation dirs
        if: always()
        continue-on-error: true
        shell: 'powershell -ExecutionPolicy Bypass -NoLogo -NoProfile -Command ". ''{0}''"' 
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows\cleanup-git-isolation.ps1"
