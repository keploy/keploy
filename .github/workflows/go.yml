name: Go on Linux

on:
  pull_request:
    branches: [ main ]

jobs:

  build:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Build arm
        run: GOOS=linux GOARCH=arm64 go build -v ./...

      # No build above compiles the darwin files. When shared proxy code
      # started calling a function that only the Linux and other-platform
      # files defined (netListenDrops), the darwin build broke without a
      # textual conflict, and every Linux check stayed green. This step fails
      # such a change on Linux, before the macOS job runs. Vet also compiles
      # the test files, which go_macos.yaml's builds do not.
      - name: Vet darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      # SECURITY: codfish/semantic-release-action was compromised on
