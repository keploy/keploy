name: Mock Mode Regression (Docker Compose, Linux)
# End-to-end guard for `keploy mock record|replay` against a docker compose
# project — the one command type where the keploy agent is a service INSIDE the
# thing being wrapped, so the app cannot be started last the way it is natively
# and is instead held at the agent's healthcheck until the proxy is armed. This
# lane guards that the compose path works at all; the ORDER of the agent calls
# is pinned by TestComposeOrdering in pkg/service/mock.
#
# Separate from mock_linux.yml because this lane needs the agent image loaded
# into the local daemon, and the job that builds it skips on fork PRs. Folding
# this into mock_linux.yml would take the native mock lane down with it there.
on:
  workflow_call:
    inputs:
      runner:
        description: 'The type of runner to use for this job'
        type: string
        required: false
        default: 'ubuntu-latest'
      jobs_to_run:
        description: 'Controls which jobs to run. "all" runs everything.'
        type: string
        required: false
        default: 'all'

jobs:
  mock_compose_linux:
    # Fork PRs are already excluded by the caller, whose needs include the
    # fork-guarded job that builds the agent image this lane loads.
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: mock-mode (docker_compose)
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      # A source build reports version 3-dev, and ghcr.io/keploy/keploy:v3-dev
      # is not published — without loading the PR's own image the compose path
      # has no agent to start at all.
      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run mock-mode docker-compose e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/mock/mock-compose-linux.sh"

  # A dependency that crashes once after keploy's agent is set up: keploy's
  # compose retry must reuse that agent, or set up again the one compose starts
  # again, or the recording (and the replay) is lost. A job of its own: its
  # four record and replay runs take minutes, and the lane above has its own
  # budget.
  compose_dep_retry_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: compose dependency retry (docker_compose)
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run compose dependency-retry e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
          REPLAY_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/compose-dep-retry-linux.sh"

  # The proven model (KEPLOY_PROVEN=1) in docker mode: keploy's agent
  # container has no Docker socket, so the CLI gives it the list of the
  # daemon's containers. `keploy record` of a compose app and of a docker run
  # app must record the calls to their dependency as
  # container:<repository>:<port>@<fingerprint>, and record no keys without
  # the switch.
  compose_container_keys_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: container keys (docker_compose, docker run)
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run docker-mode container-keys e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/compose-container-keys-linux.sh"

  # A compose app that exits on its own during `keploy record`: compose stops
  # the project, keploy's agent with it (--abort-on-container-exit). The agent
  # must wait for the recording to save what it captured: every test case,
  # mock and mapping, each stream read to the agent's end marker. The app
  # answers N calls and exits; keploy must exit 0 on its own, with all N.
  compose_app_exits_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: app exits on its own (docker_compose)
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run compose app-exits e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/compose-app-exits-linux.sh"

  # Under KEPLOY_PROVEN=1 keploy stops a compose app itself (P101-c): compose
  # runs without --abort-on-container-exit, keploy interrupts the app's
  # container at each set's end and at the recording's end, waits for its
  # stop on events (a kill only when it made no progress), reads the set's
  # end from the live agent, and starts the app again for the next set. A
  # changed shutdown publish fails its set; an app that exits on its own is
  # APP_HALTED; an interrupted keploy leaves no container or network behind.
  compose_proven_setend_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: proven set-end stop (docker_compose)
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run compose proven set-end stop e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/compose-proven-setend-linux.sh"

  # An app's own host entries (a compose service's extra_hosts, docker run
  # --add-host): Docker refuses them on an app that joins keploy's agent
  # container's network, so keploy moves them onto the agent container, and
  # maps host.docker.internal to host-gateway there. `keploy record` of each
  # must start the app, reach its dependency by the name its entry gives, and
  # record the calls.
  compose_extra_hosts_linux:
    if: ${{ inputs.jobs_to_run == 'all' }}
    runs-on: ${{ inputs.runner }}
    name: app host entries (docker_compose, docker run)
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: keploy/keploy

      - id: image
        uses: ./.github/actions/download-image
        with:
          artifact_name: docker-image-linux-amd64

      - id: record
        uses: ./.github/actions/download-binary
        with:
          src: build

      - name: Run app host entries e2e
        env:
          RECORD_BIN: ${{ steps.record.outputs.path }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/workflows/test_workflow_scripts/compose-extra-hosts-linux.sh"
