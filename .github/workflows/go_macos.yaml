name: Go on macOS

on:
  pull_request:
    branches: [ main ]

jobs:

  build:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # macOS ships as darwin/arm64 only (Apple silicon), so this is the
      # one macOS target to keep compiling.
      - name: Build arm64
        run: GOARCH=arm64 go build -v ./...

