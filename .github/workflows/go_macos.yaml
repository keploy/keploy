name: Go on macOS

on:
  pull_request:
    branches: [ main ]

jobs:

  build:
    # Bounds a hung step to an hour instead of GitHub's 6-hour job ceiling.
    # The longest healthy job in this repo runs ~32 min, so this is ~2x
    # headroom and cannot trip a job that is merely slow.
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # macOS ships as darwin/arm64 only (Apple silicon), so this is the
      # one macOS target to keep compiling.
      - name: Build arm64
        run: GOARCH=arm64 go build -v ./...

      # The step above runs on a Mac, where cgo is ON by default — so it cannot
      # see the constraint that actually binds downstream. Consumers of this
      # module cross-compile their darwin binaries FROM LINUX with
      # CGO_ENABLED=0, and under that combination any cgo-only dependency stops
      # linking rather than silently switching implementation.
      #
      # That is not hypothetical: compose v2's backend reached
      # github.com/fsnotify/fsevents through pkg/watch, fsevents is cgo-only on
      # darwin, and adding the compose library broke a downstream darwin build
      # with `undefined: EventFlags` while this workflow stayed green. The fix
      # kept the backend out of darwin builds
      # (pkg/platform/docker/compose_backend_unsupported.go). compose v5 no
      # longer links fsevents without its own `fsnotify` tag; this step is what
      # catches the next cgo-only dependency.
      - name: Build darwin/arm64 without cgo (downstream cross-compile shape)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...

      # macOS has no /proc. The process-tree walk every Ctrl+C of a native run
      # makes (utils.InterruptProcessTree) reads the kernel's process table
      # there instead, and only a Mac can run that code: a Linux runner builds
      # the other implementation.
      - name: Test utils on darwin
        run: go test -count=1 ./utils/

      # connseq.Upstream is the proxy's end of its connection to a destination.
      # Off Linux it asks the socket for no count (received_others.go), so it
      # numbers chunks by what was read. upstream_others_test.go checks that no
      # socket is asked; it builds only off Linux, so only this job and the
      # Windows one can run it. The numbering by what was read is checked by
      # upstream_test.go, which builds everywhere. Neither file had run on
      # macOS before this job.
      - name: Test connseq on darwin
        run: go test -count=1 ./pkg/agent/proxy/connseq/

      # A native macOS run serves its app's callers as live calls too, so the
      # proxy watches each caller for its hang-up there (util.WatchPeerEnd,
      # peer_end_unix.go) and tells the app when the caller leaves mid-answer
      # (incoming/client_watch.go). How a socket shows a FIN or a reset, and
      # how a read deadline ends a peek, are the kernel's: these rows check
      # them on darwin's own sockets, which a Linux runner cannot.
      - name: Test the client hang-up watch on darwin
        run: go test -count=1 ./pkg/agent/proxy/util/ ./pkg/agent/proxy/incoming/

      # The proven flow on macOS: the claimant's start time and zombie state
      # from the kernel's process table (claimer_darwin.go), the caller read
      # from the process socket tables (caller_darwin.go), and the proxy's
      # byte and connection counts from the TCP table (pairbytes_darwin.go,
      # inflight_darwin.go, accepts_darwin.go). A Linux runner builds the
      # other implementation of each, so only this job runs these rows.
      #
      # pkg/service/agent runs whole. pkg/agent/proxy and pkg/agent/routes run
      # the rows of their macOS test files only: each holds a test that does
      # not end on macOS (proxy's DNS server that cannot bind, routes' bind to
      # a port still held), so a whole run of either is not a check. The
      # script fails unless every row it reads from those files passed.
      - name: Test the proven flow on darwin
        run: |
          go test -count=1 ./pkg/service/agent/
          bash .github/scripts/macos/go-test-darwin-rows.sh pkg/agent/proxy pkg/agent/proxy/*_darwin_test.go
          bash .github/scripts/macos/go-test-darwin-rows.sh pkg/agent/routes pkg/agent/routes/*_darwin_test.go pkg/agent/routes/caller_claim_test.go
